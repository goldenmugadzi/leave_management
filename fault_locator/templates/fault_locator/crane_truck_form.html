{% extends 'fault_locator/team_overview.html' %}
{% block content %}
<div class="container">
  <h2>{{ truck|default_if_none:"New" }} Crane Truck</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-secondary" href="{% url 'fault_locator:crane_truck_list' %}">Cancel</a>
  </form>
  {% if truck %}
  <div class="mt-3"><strong>Current:</strong> {{ truck.fleet_number }} - {{ truck.number_plate }}</div>
  {% endif %}
</div>
{% endblock %}
