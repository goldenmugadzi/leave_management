{% extends 'admin_layout.html' %}
{% block content %}
{% include 'fault_locator/partials/form_styles.html' %}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-3xl mx-auto bg-white/90 backdrop-blur p-6 rounded-xl shadow-md ring-1 ring-gray-100">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-bold text-gray-800">Request Crane</h2>
      <a class="px-4 py-2 bg-gray-200 text-gray-900 rounded-lg hover:bg-gray-300" href="{% url 'fault_locator:crane_request_list' %}">Back to requests</a>
    </div>
    <form method="post" class="fl-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="mt-4 flex items-center gap-3">
        <button class="btn-primary" type="submit">Submit Request</button>
        <a class="btn-secondary" href="{% url 'fault_locator:crane_request_list' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
