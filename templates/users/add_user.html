<!--users/templates/users/add_user.html-->

{% extends 'admin_layout.html' %} {% load static %} {% load custom_filters %} 
{% block content %}
<div class="content-wrapper">
  <div
    class="bg-gulf-blue-100 shadow shadow-gulf-blue-300 text-gulf-blue-900 rounded px-2 py-2"
  >
    <form method="post">
      {% csrf_token %}
      <div class="space-y-12 px-5 py-5">
        <div class="mt-10 border-b border-gulf-blue-900/10 pb-12">
          <h2 class="text-base font-semibold leading-7 text-gulf-blue-900">
            User Information
          </h2>
          <p class="mt-1 text-sm leading-6 text-gulf-blue-900">
            Fill all required fields.
          </p>

          <div class="mt-10 grid grid-cols-3 gap-4">
            <div>
              <label
                for="firstname"
                class="block text-sm font-medium leading-6 text-gray-900"
                >First name</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="firstname"
                  id="firstname"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>

            <div>
              <label
                for="lastname"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Last name</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="lastname"
                  id="lastname"
                  autocomplete="family-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>

            <div>
              <label
                for="username"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Username</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="username"
                  id="username"
                  autocomplete="family-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>

            <div>
              <label
                for="email"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Email address</label
              >
              <div class="mt-2">
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>

            <div>
              <label
                for="region"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Region</label
              >
              <div class="mt-2">
                <select
                  id="region"
                  name="region"
                  autocomplete="region"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option value="">Select Region</option>
                  {% for region in regions %}
                  <option value="{{region.id}}">{{region.region}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div>
              <label
                for="section"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Section</label
              >
              <div class="mt-2">
                <select
                  id="section"
                  name="section"
                  autocomplete="section"
                  class="select2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option value="">Select Section</option>
                  {% for section in sections %}
                  <option value="{{section.code}}">{{section.section}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div>
              <label
                for="cost_center"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Cost Centre</label
              >
              <div class="mt-2">
                <select
                  id="cost_center"
                  name="cost_center"
                  autocomplete="cost_center"
                  class="select2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option value="">Select Cost Centre</option>
                </select>
              </div>
            </div>

            <div>
              <label
                for="designation"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Designations</label
              >
              <div class="mt-2">
                <select
                  id="designation"
                  name="designation"
                  autocomplete="designation"
                  class="select2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option value="">Select Designation</option>
                  {% for design in user_designations %}
                  <option value="{{design.id}}">{{design.description}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>

          <div class="mt-10 border-b border-gray-900/10 pb-12">
            <h2 class="text-base font-semibold leading-7 text-gray-900">
              User Password
            </h2>
            <p class="mt-1 text-sm leading-6 text-gray-600">
              Make sure the password is strong and secure.
            </p>

            <div class="mt-10 grid grid-cols-2 gap-4">
              <div>
                <label
                  for="password1"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Password</label
                >
                <div class="mt-2">
                  <input
                    type="password"
                    name="password1"
                    id="password1"
                    autocomplete="family-name"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                  />
                </div>
              </div>

              <div>
                <label
                  for="password2"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Confirm Password</label
                >
                <div class="mt-2">
                  <input
                    type="password"
                    name="password2"
                    id="password2"
                    autocomplete="password"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="flex mt-10 px-3 py-3">
        <div style="width: 50%">
          <button
            style="width: 100%"
            class="text-sm font-semibold leading-6 text-gray-900"
          >
            CANCEL
          </button>
        </div>
        <div style="width: 50%">
          <button
            style="width: 100%"
            type="submit"
            class="rounded-md bg-blue-925 hover:bg-blue-550 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
          >
            SAVE USER
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %} {% block scripts %}
<script
  type="text/javascript"
  src="{% static 'assets/js/loader.js' %}"
></script>
<script
  type="text/javascript"
  src="{% static 'assets/js/roleajax.js' %}"
></script>
<script type="text/javascript">
    const district = document.getElementById('district');
    const depot = document.getElementById('depot');
    const region = document.getElementById('region');
    const cost_center = document.getElementById('cost_center');

    region.addEventListener('change', (e) => {
      const regionId = e.target.value;
      fetch(`{{BASE_URL}}/users/filtered_centers/${regionId}`)
        .then((res) => res.json())
        .then((data) => {
          console.log("var: ", data);
          cost_center.innerHTML = '<option>Select Cost Centre</option>';
          data.forEach((_cost_center) => {
            cost_center.innerHTML += `<option value="${_cost_center.id}">${_cost_center.name}</option>`;
          });
        });
    });

    region.addEventListener('change', (e) => {
        const regionId = e.target.value;
        fetch(`{{BASE_URL}}/users/filtered_districts/${regionId}`)
          .then((res) => res.json())
          .then((data) => {
            console.log("var: ", data);
            district.innerHTML = '<option>Select District</option>';
            data.forEach((_district) => {
              district.innerHTML += `<option value="${_district.id}">${_district.district}</option>`;
            });
          });
      });

    district.addEventListener('change', (e) => {
      const districtId = e.target.value;
      fetch(`{{BASE_URL}}/users/filtered_depots/${districtId}`)
        .then((res) => res.json())
        .then((data) => {
          console.log("depots: ", data);
          depot.innerHTML = '<option>Select Depot</option>';
          data.forEach((_depot) => {
            depot.innerHTML += `<option value="${_depot.id}">${_depot.depot}</option>`;
          });
        });
    });
</script>
{% endblock %}
