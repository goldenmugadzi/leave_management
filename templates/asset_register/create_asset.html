{% extends 'admin_layout.html' %} 
{% load static %}
{% load custom_filters %}
{% block content %}

 <div class="content-wrapper">
  
  <div class="bg-gulf-blue-100 shadow shadow-gulf-blue-300 text-gulf-blue-900 rounded px-2 py-2">
    <form method="post">
      {% csrf_token %}
      <div class="space-y-12 px-5 py-5">

        <div class="mt-10 border-b border-gulf-blue-900/10 pb-12">
          <h3 class="text-base font-semibold leading-7 text-gulf-blue-900">
            User Information
          </h3>
          <p class="mt-1 text-sm leading-6 text-gulf-blue-900">
            Fill all required fields.
          </p>

          <div class="mt-10 grid grid-cols-3 gap-4">

            <div>
              <label
                  for="product_id"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Product Type</label
              >
              <div class="mt-2">
                <select
                id="product_id"
                name="product_id"
                  autocomplete="designation"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option>Select product</option>
                  {% for product_type in product_types %}
                  <option value="{{ product_type.id }}">{{ product_type.product_type }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div>
              <label
                for="asset_state"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Asset State</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="asset_state"
                  id="asset_state"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>
            <div>
              <label
                for="asset_number"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Serial Number</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="serial_number"
                  id="serial_number"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>
            <div>
              <label
                for="asset_number"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Asset Number</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="asset_number"
                  id="asset_number"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>
            <div>
              <label
                for="department"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Department</label
              >
              <div class="mt-2">
                <select
                  id="department"
                  name="department"
                  autocomplete="department"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option>Select department</option>
                  {% for section in sections %}
                  <option value="{{ section.id }}">{{ section.section }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div>
              <label
                for="user"
                class="block text-sm font-medium leading-6 text-gray-900"
                >User</label
              >
              <div class="mt-2">
                <select
                  id="user"
                  name="user"
                  autocomplete="user"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option>Select user</option>
                  {% for user in users %}
                  <option value="{{ user.id }}">{{ user.first_name }} {{ user.last_name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div>
              <label
                for="regions"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Region</label
              >
              <div class="mt-2">
                <select
                  id="regions"
                  name="regions"
                  autocomplete="regions"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option>Select region</option>
                  {% for region in regions %}
                  <option value="{{ region.id }}">{{ region.region }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div>
              <label
                for="purchase_cost"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Purchase Cost</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="purchase_cost"
                  id="purchase_cost"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>
            <div>
              <label
                for="designations"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Designation</label
              >
              <div class="mt-2">
                <select
                  id="designations"
                  name="designations"
                  autocomplete="designations"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option>Select Designation</option>
                  {% for designation in designations %}
                  <option value="{{ designation.id }}">{{ designation.description }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div>
              <label
                for="date_purchased"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Date Purchased</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="date_purchased"
                  id="date_purchased"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>
            <div>
              <label
                for="Warrant"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Warrant</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="warrant"
                  id="warrant"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>
            <div>
              <label
                for="model"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Model</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="model"
                  id="model"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>

              {% comment %} <div class="col-md-4 pr-md-1">
                <div class="form-group">
                  <label
                    for="region"
                    class="block text-sm font-medium leading-6 text-gray-900"
                    >Date Created</label
                  >
                  <div class="mt-2">
                    <input
                      type="text"
                      name="region"
                      id="region"
                      autocomplete="given-name"
                      class="form-control"
                    />
                  </div>
                </div>
              </div> {% endcomment %}
            </div>
            
            <div class="flex mt-10 px-3 py-3">
              <div style="width: 50%;">
                <button style="width: 100%;" class="text-sm font-semibold leading-6 text-gray-900">
                  CANCEL
                </button>
              </div>
              <div style="width: 50%;">
                <button
                style="width: 100%;"
                  type="submit"
                  class="rounded-md bg-blue-925 hover:bg-blue-550 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
                >
                  SAVE USER
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
      {% endblock %}
