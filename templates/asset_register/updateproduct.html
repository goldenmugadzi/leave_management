{% extends 'admin_layout.html' %} 
{% load static %}
{% load custom_filters %}
{% block content %}
    <style>
      input[type=text], select {
        width: 100%;
        padding: 10px;  
      }
      </style>
<div class="flex justify-center items-center min-h-screen">
  <div class="container max-w-8xl bg-white shadow-md rounded-lg p-8">
    <div class="card" style="width: 75rem;">
      <div class="card-body" card bg-dark>
        <h5 class="text-2xl font-bold text-black">Update Product</h5>
          <p class="card-description text-base font-bold text-black mt-2">
            All fields are required to be filled.
          </p>
        <form action="" method="POST">
          {% csrf_token %}
          <div class="mt-10 grid grid-cols-3 gap-3">
            <div>
                <label
                  for="id"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  > Product ID</label
                >
                <div class="mt-2">
                  <input
                    required
                    type="text"
                    name="id"
                    id="id"
                    value="{{producttype.id}}"
                    class="block w-full bg-gulf-blue-50 rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                  />
                </div>
              </div>
            <div>
              <label
                for="product_type"
                class="block text-sm font-medium leading-6 text-gray-900"
                > Product Type</label
              >
              <div class="mt-2">
                <input
                  required
                  type="text"
                  name="product_type"
                  id="product_type"
                  value="{{producttype.product_type}}"
                  class="block w-full bg-gulf-blue-50 rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>
            <div>
                <label
                  for="code"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Code</label
                >
                <div class="mt-2">
                  <input
                    required
                    type="text"
                    name="code"
                    id="code"
                    value="{{producttype.code}}"
                    class="block w-full bg-gulf-blue-50 rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 px-2 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                  />
                </div>
              </div>
          </div>    
          <div class="flex mt-10 px-3 py-3">
            <div style="width: 50%;">
              <button style="width: 100%;" class="text-sm font-semibold leading-6 text-gray-900">
                CANCEL
              </button>
            </div>
            <div style="width: 50%;">
              <button
              style="width: 100%;"
                type="submit"
                class="rounded-md bg-blue-925 hover:bg-blue-550 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
              >
                SAVE PRODUCT
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
