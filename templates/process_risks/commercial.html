{% extends 'admin_layout.html' %} {% load static %} {% block content %}

<div style="margin-bottom: 25px;" class="content-wrapper flex flex-wrap p-2 m-px">
  {%for file in files%}
  <a href="/process_risks/download_file?file_id={{file.id}}">
    <button  style="width: 12rem;height: 5rem;background-color: #0dc5d2;margin-right: 20px;margin-bottom: 25px" class=" w-28 bg-blue-800 hover:bg-blue-900 outline-none focus:outline-none border px-3 py-1 rounded flex items-center">
        <span class="pr-1 font-semibold flex-1 text-blue-50">{{file.file_name}}</span>
       
    </button>
    </a> 
   
   
   
    {%endfor%}
</div>
<div style="display: flex;justify-content: start;">
    <a href="javascript:history.back()">
    <button  style="width: 6rem;height: 3rem;background-color: #020617;margin-right: 20px;border-radius: 1.5rem;" class=" w-28 bg-blue-800 hover:bg-blue-900 outline-none focus:outline-none border px-3 py-1 rounded flex items-center">
        <span class="pr-1 font-semibold flex-1 text-blue-50">Back</span>
       
    </button> </a>
</div>
{% endblock %}
