{% extends 'admin_layout.html' %} 
{% load static %}
{% load custom_filters %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
</script>
 <div class="content-wrapper">
  
  <div class="bg-gulf-blue-100 shadow shadow-gulf-blue-300 text-gulf-blue-900 rounded px-2 py-2">
    <form method="post" >
      {% csrf_token %}
      <div class="space-y-12 px-5 py-5">

        <div class="mt-10 border-b border-gulf-blue-900/10 pb-12">
          <h1 class="text-base font-semibold leading-7 text-gulf-blue-900">
            Create Your Fault
          </h1>
          <p class="mt-1 text-sm leading-6 text-gulf-blue-900">
            All fields are required to be filled.
          </p>

          <div class="mt-10 grid grid-cols-3 gap-4">
            <div>
              <label
                for="serialnumber"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Serial Number</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="eserialnumber"
                  id="eserialnumber"
                  autocomplete="given-name"
                  class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"
                />
              </div>
            </div>
            <div>
              <label
                for="fault"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Fault</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="efault"
                  id="efault"
                  autocomplete="given-name"
                  class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"
                />
              </div>
            </div>
            <div>
              <label
                for="department"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Department</label
              >
              <div class="mt-2">
                <select
                  id="department"
                  name="department"
                  autocomplete="department"
                  class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"
                >
                  <option>Select department</option>
                  {% for section in sections %}
                  <option value="{{ section.id }}">{{ section.section }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div>
              <label
                for="Username"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Username</label
              >
              <div class="mt-2">
                <select
                  id="eUsername"
                  name="eUsername"
                  class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"
                >
                  <option value="">Select user</option>
                  {% for user in users %}
                  <option value="{{ user.id }}">{{ user.first_name }} {{ user.last_name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div>
              <label
                for="regions"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Region</label
              >
              <div class="mt-2">
                <select
                  id="regions"
                  name="regions"
                  autocomplete="regions"
                  class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"
                >
                  <option>Select region</option>
                  {% for region in regions %}
                  <option value="{{ region.id }}">{{ region.region }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div>
              <label
                for="phoneextension"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Phone Extension</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="ephoneextension"
                  id="ephoneextension"
                  autocomplete="given-name"
                  class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"
                />
              </div>
            </div>
          </div>
            <div class="flex mt-10 px-3 py-3">
              <div style="width: 50%;">
                <button style="width: 100%;" class="text-sm font-semibold leading-6 text-gray-900">
                  CANCEL
                </button>
              </div>
              <div style="width: 50%;">
                <button
                style="width: 100%;"
                  type="submit"
                  class="rounded-md bg-blue-925 hover:bg-blue-550 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
                >
                  SAVE USER
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
      {% endblock %}
