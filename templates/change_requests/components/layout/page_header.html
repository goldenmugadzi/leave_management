<!-- Page Header Component -->
<div class="flex flex-col lg:flex-row lg:justify-between lg:items-center mb-6">
  <div class="mb-4 lg:mb-0">
    <h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1>
    <p class="text-gray-600 mt-1">{{ subtitle }}</p>
  </div>
  <div>
    <a
      href="{{ back_url }}"
      class="inline-flex items-center px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors"
    >
      <i class="fas fa-arrow-left mr-2"></i> {{ back_text|default:"Back to Dashboard" }}
    </a>
  </div>
</div>
