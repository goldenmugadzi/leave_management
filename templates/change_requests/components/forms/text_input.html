<!-- Text Input Component -->
<div class="mb-6">
  <label for="{{ id }}" class="block text-sm font-medium text-gray-700 mb-2">
    {{ label }}{% if required %} <span class="text-red-500">*</span>{% endif %}
  </label>
  <input
    type="text"
    id="{{ id }}"
    name="{{ name }}"
    value="{{ value|default:'' }}"
    {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
    {% if required %}required{% endif %}
    {% if readonly %}readonly{% endif %}
    class="block w-full border border-gray-300 rounded-md px-3 py-2 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 {% if readonly %}bg-gray-50 cursor-not-allowed{% endif %}"
  />
  {% if help_text %}
  <p class="mt-1 text-sm text-gray-500">{{ help_text }}</p>
  {% endif %}
</div>
