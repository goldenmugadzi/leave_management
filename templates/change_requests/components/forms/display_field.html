<!-- Display Field Component (Read-only) -->
<div class="mb-6">
  <p class="text-xs font-semibold text-gray-500 tracking-wide uppercase mb-1">{{ label }}</p>
  <div class="block w-full border border-gray-200 rounded-md px-3 py-2 text-gray-900 bg-gray-50 whitespace-pre-line leading-relaxed">
    {{ value|default:"N/A"|linebreaksbr }}
  </div>
  {% if help_text %}
  <p class="mt-1 text-sm text-gray-500">{{ help_text }}</p>
  {% endif %}
</div>
