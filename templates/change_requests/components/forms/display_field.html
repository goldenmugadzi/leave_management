<!-- Display Field Component (Read-only) -->
<div class="mb-6">
  <label class="block text-sm font-medium text-gray-700 mb-2">{{ label }}</label>
  <div class="block w-full border border-gray-200 rounded-md px-3 py-2 text-gray-900 bg-gray-50">
    {{ value|default:"N/A" }}
  </div>
  {% if help_text %}
  <p class="mt-1 text-sm text-gray-500">{{ help_text }}</p>
  {% endif %}
</div>
