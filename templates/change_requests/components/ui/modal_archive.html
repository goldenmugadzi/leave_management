<!-- Archive Modal Component -->
<div
  id="modalArchive"
  class="modal-overlay fixed inset-0 z-50 overflow-y-auto"
  style="display: none;"
  aria-labelledby="modal-title"
  role="dialog"
  aria-modal="true"
>
  <div
    class="flex items-end justify-center min-h-screen px-4 text-center md:items-center sm:block sm:p-0"
  >
    <div
      class="modal-backdrop fixed inset-0 transition-opacity bg-gray-500 bg-opacity-40"
      aria-hidden="true"
    ></div>

    <div
      class="inline-block w-full max-w-xl p-8 my-20 overflow-hidden text-left transition-all transform bg-white rounded-lg shadow-xl 2xl:max-w-2xl relative"
    >
      <div class="flex items-center justify-between space-x-4">
        <h1 class="text-xl font-medium text-gray-800">
          Archive Change Request
        </h1>

        <button
          type="button"
          class="closeModalArchive text-gray-600 focus:outline-none hover:text-gray-700"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </button>
      </div>

      <p class="mt-2 text-sm text-gray-500">
        Are you sure you want to archive this change request? This action cannot be undone.
      </p>

      <div class="flex justify-evenly mt-6">
        <button
          type="button"
          class="closeModalArchive px-3 py-2 text-sm tracking-wide text-gray-900 capitalize transition-colors duration-200 transform focus:outline-none focus:ring-opacity-50"
        >
          Cancel
        </button>
        <button
          type="button"
          id="confirmArchive"
          class="px-3 py-2 text-sm tracking-wide text-white capitalize transition-colors duration-200 transform bg-red-600 rounded-md hover:bg-red-700 focus:outline-none focus:bg-red-500 focus:ring focus:ring-red-300 focus:ring-opacity-50"
        >
          Confirm Archive
        </button>
      </div>
    </div>
  </div>
</div>
