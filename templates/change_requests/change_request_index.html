<!--users/templates/quotations/index.html-->
{% extends 'admin_layout.html' %} {% block styles %}
<link
  rel="stylesheet"
  href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"
/>
<style>
  .dataTables_wrapper .dataTables_length select {
    width: 4rem;
  }
</style>
{% endblock styles %} {% block content %}
<div class="content-wrapper">
  <div
    class="bg-gulf-blue-100 shadow shadow-gulf-blue-300 text-gulf-blue-900 rounded px-2 py-2"
  >
    <div class="flex justify-between items-center mb-5">
      <span class="text-lg font-semibold">CHANGE REQUESTS</span>
      <a
        href="/change_requests/create_change_request"
        class="bg-gulf-blue-600 hover:bg-gulf-blue-800 text-white font-bold py-2 px-4 rounded"
        >
        CREATE CHANGE REQUEST
      </a>
    </div>
    <table id="change_request_index" class="display" style="width: 100%">
      <thead>
        <tr>
          <th>ID</th>
          <th>TYPE</th>
          <th>DESCRIPTIONS</th>
          <th>REASON</th>
          <th>DONE BY</th>
          <th>DATE</th>
          <th>ACTION</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <th>ID</th>
          <th>TYPE</th>
          <th>DESCRIPTIONS</th>
          <th>REASON</th>
          <th>DONE BY</th>
          <th>DATE</th>
          <th>ACTION</th>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<!-- Buttons JS -->
<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.print.min.js"></script>
<!-- PDFMake (for PDF export) -->
<script type="text/javascript" charset="utf8" src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.36/pdfmake.min.js"></script>
<script type="text/javascript" charset="utf8" src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.36/vfs_fonts.js"></script>
<!-- JSZip (for Excel export) -->
<script type="text/javascript" charset="utf8" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script>

  $(document).ready(function () {
    $("#change_request_index").DataTable({
      dom: 'Bfrtip',
      buttons: [
          {
              extend: 'csv',
              text: 'Export to CSV',
              className: "bg-gulf-blue-400 hover:bg-gulf-blue-800 text-gulf-blue-950 font-bold py-2 px-4 rounded"
          },
          {
              extend: 'excel',
              text: 'Export to Excel',
              className: "bg-gulf-blue-400 hover:bg-gulf-blue-800 text-gulf-blue-950 font-bold py-2 px-4 rounded"
          },
          {
              extend: 'pdf',
              text: 'Export to PDF',
              className: "bg-gulf-blue-400 hover:bg-gulf-blue-800 text-gulf-blue-950 font-bold py-2 px-4 rounded"
          },
          {
              extend: 'print',
              text: 'Print Table',
              className: "bg-gulf-blue-400 hover:bg-gulf-blue-800 text-gulf-blue-950 font-bold py-2 px-4 rounded"
          }
      ],
      "processing": true,
      "serverSide": true,
      "ajax": {
        "url": "/change_requests/datatables",
        "type": "GET"
      },
      columns: [
        {
          data: "cr_id",
        },
        {
          data: "change_type",
        },
        {
          data: "change_description",
        },
        {
          data: "change_reason",
        },
        {
          data: "created_by",
        },
        {
          data: "created_at",
        },
        {
          data: "id",
          orderable: false,
          searchable: false,
          render: function (data, type, row, meta) {
            return `
              <a type="button" class="btn btn-info" href='/change_requests/new_profile_request?i=${row.cr_id}' >
                <i class="fa-solid fa-pen-to-square"></i>              
              </a>
              <a type="button" class="btn btn-secondary" href='/change_requests/approve_change_request?i=${row.cr_id}' >
                <i class="fa-solid fa-signature w-6 h-6"></i>
              </a>
              <a type="button" class="btn btn-secondary" href='/change_requests/view_change_request?i=${row.cr_id}' >
                <i class="fa-solid fa-circle-info"></i>
              </a>`;
          },
        }
      ],
      order: [[5, 'desc']]
    });
  });
</script>
{% endblock scripts %}
