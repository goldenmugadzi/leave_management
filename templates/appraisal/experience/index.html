{% load static %}

    <div class="content-wrapper my-4">
      <div class="grid grid-cols-1">
        <div class="bg-gulf-blue-96 shadow-lg rounded-lg p-3">
          <div class="flex justify-between my-2">           
              <h3 class="text-center font-bold">User Experiences</h3>
              <a href="{% url 'create_appraisal' %}"
                  class="bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4">Add Experience</a>

          </div>
          
            <div class="overflow-x-auto">
                <table class="min-w-full border-collapse border border-gray-200 shadow-md rounded-lg"
                style="max-height: 75px; overflow-y: auto;"
                >
                    <thead>
                    <tr class="bg-blue-500 text-white">
                        <th class="px-6 py-2 text-left text-sm font-semibold">Name</th>
                        <th class="px-6 py-2 text-left text-sm font-semibold">Years of Experience</th>
                        <th class="px-6 py-2 text-left text-sm font-semibold">Months of Experience</th>
                        <th class="px-6 py-2 text-left text-sm font-semibold"></th>
                    </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    {% for experience_object in experience_objects %}
                        <tr class="hover:bg-gray-100">
                            <td class="px-6 py-4 whitespace-nowrap">{{ experience_object.experience.name }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">{{ experience_object.years_of_experience }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">{{ experience_object.months_of_experience }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">Action</td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>

          </div>
        </div>
      </div>
