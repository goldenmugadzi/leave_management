<div class="bg-white shadow-xl rounded-lg border border-indigo-200 p-6 mt-4">
    <div class="bg-white shadow-lg rounded-lg border-2 border-indigo-400 my-4 p-4">
                <!-- Tab Navigation -->
                <div class="bg-gray-100 rounded-lg p-1">
                    <ul class="flex flex-wrap gap-4 -mb-px text-md font-medium text-center">
                        <li class="mr-1 border-2 rounded-lg border-2 border-gray-400">
                            <button class="perf-assmt-tab-button inline-block px-4 py-2 border-2 border-transparent rounded-md text-gray-600 bg-transparent hover:bg-gray-200 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 active shadow-sm" data-tab="first-quarter-perf-assmt" aria-selected="true">First Quarter</button>
                        </li>
                        <li class="mr-1 border-2 rounded-lg border-2 border-gray-400">
                            <button class="perf-assmt-tab-button inline-block px-4 py-2 border-2 border-transparent rounded-md text-gray-600 bg-transparent hover:bg-gray-200 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2" data-tab="second-quarter-perf-assmt" aria-selected="false">Second Quarter</button>
                        </li>
                        <li class="mr-1 border-2 rounded-lg border-2 border-gray-400">
                            <button class="perf-assmt-tab-button inline-block px-4 py-2 border-2 border-transparent rounded-md text-gray-600 bg-transparent hover:bg-gray-200 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2" data-tab="third-quarter-perf-assmt" aria-selected="false">Third Quarter</button>
                        </li>
                        <li class="mr-1 border-2 rounded-lg border-2 border-gray-400">
                            <button class="perf-assmt-tab-button inline-block px-4 py-2 border-2 border-transparent rounded-md text-gray-600 bg-transparent hover:bg-gray-200 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2" data-tab="fourth-quarter-perf-assmt" aria-selected="false">Fourth Quarter</button>
                        </li>
                    </ul>
                </div>
    
                <!-- Tab Content -->
                <div class="tab-content mt-6">
                    <!-- first-quarter-perf-assmt Tab -->
                    <div id="first-quarter-perf-assmt" class="perf-assmt-tab-pane active">
                        <div class="bg-white shadow-xl rounded-lg border-2 border-indigo-400 p-6">
                            <div class="flex justify-between">
                                <h3 class="text-lg font-semibold text-gray-900 mb-4">First Quarter</h3>
                            </div>
                            {% include 'appraisal/detail_components/perf_assmt_table.html' with quarter_number=1 %}
                        </div>
                    </div>
                    
                    <!-- second-quarter-perf-assmt Tab -->
                    <div id="second-quarter-perf-assmt" class="perf-assmt-tab-pane hidden">
                        <div class="bg-white shadow-xl rounded-lg border-2 border-indigo-400 p-6">
                            <div class="flex justify-between">
                                <h3 class="text-lg font-semibold text-gray-900 mb-4">Second Quarter</h3>
                            </div>
                            
                        </div>
                    </div>

                    <!-- third-quarter-perf-assmt Tab -->
                    <div id="third-quarter-perf-assmt" class="perf-assmt-tab-pane hidden">
                        <div class="bg-white shadow-xl rounded-lg border-2 border-indigo-400 p-6">
                            <div class="flex justify-between">
                                <h3 class="text-lg font-semibold text-gray-900 mb-4">Third Quarter</h3>
                            </div>
                            
                        </div>
                    </div>

                    <!-- fourth-quarter-perf-assmt Tab -->
                    <div id="fourth-quarter-perf-assmt" class="perf-assmt-tab-pane hidden">
                        <div class="bg-white shadow-xl rounded-lg border-2 border-indigo-400 p-6">
                            <div class="flex justify-between">
                                <h3 class="text-lg font-semibold text-gray-900 mb-4">Fourth Quarter</h3>
                            </div>
                            
                        </div>
                    </div>
    
                    
                </div>
            </div>
    </div>
</div>

<script>
        document.addEventListener('DOMContentLoaded', function () {
        const tabButtons = document.querySelectorAll('.perf-assmt-tab-button');
        const tabPanes = document.querySelectorAll('.perf-assmt-tab-pane');

        tabButtons.forEach(button => {
            button.addEventListener('click', function () {
                // Remove active classes
                tabButtons.forEach(btn => {
                    btn.classList.remove('active', 'bg-white', 'text-indigo-600', 'border-indigo-500', 'shadow-sm');
                    btn.classList.add('text-gray-600', 'bg-transparent', 'border-transparent', 'hover:bg-gray-200', 'hover:text-gray-900');
                    btn.setAttribute('aria-selected', 'false');
                });
                tabPanes.forEach(pane => pane.classList.add('hidden'));

                // Add active class to clicked button and show corresponding pane
                this.classList.add('active', 'bg-white', 'text-indigo-600', 'border-indigo-500', 'shadow-sm');
                this.classList.remove('text-gray-600', 'bg-transparent', 'border-transparent', 'hover:bg-gray-200', 'hover:text-gray-900');
                this.setAttribute('aria-selected', 'true');
                const targetPane = document.getElementById(this.dataset.tab);
                targetPane.classList.remove('hidden');
            });
        });
    });
</script>
