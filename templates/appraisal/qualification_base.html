{% load crispy_forms_tags %}

<div class="qualification-form p-2">
    <div class="grid grid-flow-col justify-stretch gap-4">
        <div class="form-row field-name">{{ qualification_form.name|as_crispy_field }}</div>
        <div class="form-row field-file">{{ qualification_form.file|as_crispy_field }}</div>
    </div>
    <button type="button" class="remove-qualification-btn ring-2 ring-red-600" onclick="removeQualificationForm(this, '{{total_form_count}}')">Remove</button>
</div>
