{% load crispy_forms_tags %}

<div class="qualification-form p-2">
    <div class="grid grid-flow-col justify-stretch gap-4">
        <div class="form-row field-name">{{ qualification_form.name|as_crispy_field }}</div>
        <div class="form-row field-file">{{ qualification_form.file|as_crispy_field }}</div>
    </div>

    <div class="flex justify-center pb-2">
        <div>
            <button 
                type="button" 
                id="add-qualification-btn"
                class="bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" 
                onclick="addQualificationForm('{{ qualification_forms.total_form_count }}')">
                Add Qualification
            </button>
        </div>
        <div>
            <button 
                type="button" 
                class="remove-qualification-btn bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" 
                onclick="removeQualificationForm(this, '{{total_form_count}}')">
                Remove
            </button>
        </div>

    </div>
    <hr class="h-1 bg-gray-400 border-0 my-4"/>
</div>
