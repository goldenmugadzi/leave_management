{% load crispy_forms_tags %}


<div class="experience-form p-2">
    <div class="form-row field-experience flex gap-1 justify-between">

        <div class="flex-1">
            {{ experience_form.experience|as_crispy_field }}
        </div>
        <div class="flex-2 pt-7">
            <a 
                href="{% url 'create_experience' %}"
                onclick="window.open(this.href, 'experience_popup', 'width=600,height=400'); return false;"
                data-pop="yes"
                title="Add another experience"
                class="bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4"
            >
             Create New Experience
            </a>
        </div>
    </div>

    <div class="grid grid-flow-col justify-stretch gap-2">
        <div class="form-row field-years_of_experience">
            {{ experience_form.years_of_experience|as_crispy_field }}
        </div>
    
        <div class="form-row field-months_of_experience">
            {{ experience_form.months_of_experience|as_crispy_field }}
        </div>
    </div>
    <div class="flex justify-center pb-2">
        <div>
            <button 
                type="button" 
                id="add-experience-btn" 
                class="bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" 
                onclick="addExperienceForm('{{ appraisal_experience_forms.total_form_count }}')">
                Add Experience
            </button>
        </div>
        <div>
            <button type="button" class="remove-experience-btn bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" onclick="removeExperienceForm(this, '{{total_form_count}}')">Remove</button>
        </div>

    </div>
    <hr class="h-1 bg-gray-400 border-0 my-4"/>
    
</div>
