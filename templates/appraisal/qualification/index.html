
{% load static %}

    <div class="content-wrapper my-4">
      <div class="grid grid-cols-1">
        <div class="bg-gulf-blue-96 shadow-lg rounded-lg p-3">
          <div class="flex justify-between my-2">           
              <h3 class="text-center font-bold">User Qualifications</h3>
              <a href="{% url 'create_qualification' appraisal_object.id %}"
                  class="bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4">Add Qualification</a>

          </div>
          
            <div style="max-height: 300px; overflow-y: auto; border: 1px solid #ccc;">
                <table class="min-w-full border-collapse border border-gray-200 shadow-md rounded-lg">
                    <thead>
                    <tr class="bg-blue-500 text-white">
                        <th class="px-6 py-2 text-left text-sm font-semibold">Name</th>
                        <th class="px-6 py-2 text-left text-sm font-semibold">Qualification Document</th>
                    </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    {% for qualification_object in qualification_objects %}
                        <tr class="hover:bg-gray-100">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <a 
                                    href="{% url 'update_qualification' qualification_object.id %}"
                                    >{{qualification_object.name}}
                                </a>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <a 
                                    href={{qualification_object.file.url}}
                                    target="_blank"
                                    class="bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white p-2"
                                    >Preview Document</a>
                                </div>
                            </td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>

          </div>
        </div>
      </div>
