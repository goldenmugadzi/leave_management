{% load crispy_forms_tags %}

<!-- Modal -->
<div id="JobCompetency" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3 max-h-[90vh] overflow-y-auto">
        <h2 class="text-lg font-bold my-2">Required Competency Form</h2>
        <form method="post">
            {%csrf_token%}
            <div 
                class="flex-1 px-2 shadow-xl rounded-lg border-2 my-2"
                >
                    {{ job_competency_form.required_competency|as_crispy_field }}
            </div>


            <div class="flex justify-end mt-2 mr-8 gap-2">
                <button type="submit" class="w-96 bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" name="job_competency_request">Save</button>
                <button type="button" onclick="closeJobCompetency()" class="px-4 py-2 text-white bg-red-500 rounded-lg">Close</button>
            </div> 
        </form>

    </div>
</div>


<script>
    function openJobCompetency() {
        const modal = document.getElementById("JobCompetency");
        modal.classList.remove("hidden");
    }

    function closeJobCompetency() {
        document.getElementById("JobCompetency").classList.add("hidden");
    }
</script>
