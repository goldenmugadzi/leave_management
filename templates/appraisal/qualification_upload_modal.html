{% load crispy_forms_tags %}
{% load static %}

<!-- Modal -->
<div id="addUserQualifications" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-end p-1">
            <button onclick="closeAddUserQualifications()" class="hover:bg-red-300 rounded p-1 text-white bg-red-500 rounded-lg">
                Close
            </button>
        </div>

        <div class="bg-gray-100 rounded-2xl m-1">
            <h2 class="p-4 text-xl font-bold">Upload New User Qualifications</h2>
        </div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ qualification_upload_form|crispy }}
            <div class="flex justify-center my-2">
                <button type="submit" class="w-96 bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" name="qualifications_file">Upload</button>
            </div>
        </form>

    </div>
</div>


<script>
    function openAddUserQualifications() {
        const modal = document.getElementById("addUserQualifications");
        modal.classList.remove("hidden");
    }

    function closeAddUserQualifications() {
        document.getElementById("addUserQualifications").classList.add("hidden");
    }
</script>
