
<!-- Modal -->
<div id="CompetencyGap" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3 max-h-[90vh] overflow-y-auto">
        <h2 class="text-lg font-bold my-2">COMPETENCY GAPS (specific skills required)</h2>
        
        <div class="my-2">
            <table class="min-w-full border-collapse border border-gray-200 shadow-md rounded-lg">
                <thead>
                    <tr class="bg-blue-500 text-white">
                        <th class="px-6 py-2 text-left text-sm font-semibold">Gap</th>
                        
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                {% for competency_obj in competency_gaps %}
                    <tr class="hover:bg-gray-100 py-2">
                        <td class="px-6 py-4 whitespace-nowrap">
                            {{ competency_obj.required_competency }}
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="flex justify-end">
            <button type="button" onclick="closeCompetencyGap()" class="px-4 py-2 text-white bg-red-500 rounded-lg">Close</button>
        </div>

    </div>
</div>


<script>
    function openCompetencyGap() {
        const modal = document.getElementById("CompetencyGap");
        modal.classList.remove("hidden");
    }

    function closeCompetencyGap() {
        document.getElementById("CompetencyGap").classList.add("hidden");
    }
</script>
