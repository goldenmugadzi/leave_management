{% load crispy_forms_tags %}

<div class="competency-form p-2">
    <div class="grid grid-flow-col justify-stretch gap-4">
        <div class="form-row field-name">{{ competency_form.required_competency|as_crispy_field }}</div>
        <div class="form-row field-file">{{ competency_form.competency_gap|as_crispy_field }}</div>
    </div>
    <div class="flex justify-center pb-2 gap-1">
        <button 
            type="button" 
            id="add-competency-btn" 
            class="bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" 
            onclick="addCompetencyForm('{{ total_form_count }}')">
            Add Competency
        </button>
        <button 
            type="button" 
            class="remove-competency-btn bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" 
            onclick="removeCompetencyForm(this, '{{total_form_count}}')">
            Remove
        </button>
    </div>
    <hr class="h-1 bg-gray-400 border-0 my-4"/>
</div>
