

<!-- Modal (Hidden by Default) -->
<div id="myModal-{{modal_id}}" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3">
        <h2 class="text-xl font-bold mb-4">{{modal_heading}}</h2>
        <p class="text-gray-600 mb-4">{{modal_description}}</p>
        <div>{{modal_body}}</div>
        <div class="flex justify-end">
            <button onclick="closeModal('{{modal_id}}')" class="px-4 py-2 text-white bg-red-500 rounded-lg">Close</button>
        </div>
    </div>
</div>

<script>
    function openModal(modal_id) {
        document.getElementById(`myModal-${modal_id}`).classList.remove("hidden");
    }

    function closeModal(modal_id) {
        document.getElementById(`myModal-${modal_id}`).classList.add("hidden");
    }
</script>
