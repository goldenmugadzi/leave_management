{% load crispy_forms_tags %}

<!-- Modal -->
<div id="AppraiserConfirmationModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3 max-h-[90vh] overflow-y-auto">
        <form method="post">
            {%csrf_token%}
            <div 
                class="flex-1 px-2 shadow-xl rounded-lg border-2"
                >
                    {{ score_form.appraiser_confirmation|as_crispy_field }}
            </div>

            <div
                class="flex-1 px-2 shadow-xl rounded-lg border-2"
                >
                {{ score_form.comments|as_crispy_field }}
            </div>

            <div class="flex justify-end mt-2 mr-8 gap-2">
                {% if is_appraiser == True %}
                    {% if score_object.is_scored %}
                        <button type="submit" class="w-96 bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" name="appraiser_request">Save</button>
                    {% endif %}
                {% endif %}
                <button type="button" onclick="closeAppraiserConfirmationModal()" class="px-4 py-2 text-white bg-red-500 rounded-lg">Close</button>
            </div> 
        </form>

    </div>
</div>


<script>
    function openAppraiserConfirmationModal() {
        const modal = document.getElementById("AppraiserConfirmationModal");
        modal.classList.remove("hidden");
    }

    function closeAppraiserConfirmationModal() {
        document.getElementById("AppraiserConfirmationModal").classList.add("hidden");
    }
</script>
