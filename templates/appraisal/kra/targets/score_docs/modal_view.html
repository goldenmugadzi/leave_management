
<!-- Modal -->
<div id="supportingDocsModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3 max-h-[90vh] overflow-y-auto">
        <h2 id="modal-heading" class="text-xl font-bold mb-2"></h2>
        <p id="modal-description" class="text-gray-600 mb-2"></p>
        
        <div id="modal-content">
            <!-- Partial content will be inserted here -->
        </div>

        <div class="flex justify-end mt-2 mr-8">
            <button onclick="closeSupportingDocsModal()" class="px-4 py-2 text-white bg-red-500 rounded-lg">Close</button>
        </div>
    </div>
</div>


<script>
    function openSupportingDocsModal(supportingDocsUrl) {
        const modal = document.getElementById("supportingDocsModal");
        const heading = document.getElementById("modal-heading");
        const description = document.getElementById("modal-description");
        const content = document.getElementById("modal-content");
        
        // Reset modal content
        heading.textContent = "";
        description.textContent = "";
        content.innerHTML = "<p class='text-gray-500'>Loading...</p>";

        
        // Fetch modal content dynamically
        fetch(supportingDocsUrl)
            .then(response => response.json())
            .then(data => {
                heading.textContent = data.heading;
                description.textContent = data.description;
                content.innerHTML = data.content;
                modal.classList.remove("hidden");
            })
            .catch(err => {
                modal.classList.remove("hidden");
                content.innerHTML = "<p class='text-red-500'>Failed to load data.</p>";
                console.error(err);
            });
    }

    function closeSupportingDocsModal() {
        document.getElementById("supportingDocsModal").classList.add("hidden");
    }
</script>
