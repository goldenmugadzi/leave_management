{% extends "admin_layout.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-4">
    <div class="p-2">
        <form method="post" enctype="multipart/form-data">
            {%csrf_token%}
            {{ score_document_form|crispy }}
            <div class="flex justify-center my-2">
                {% if is_create == True %}
                    <button type="submit" class="w-96 bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4">Save</button>
                {% else %}
                    <div class="flex justify-between gap-2">
                        <button type="submit" class="w-96 bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" name="save_request">Save</button>
                        <button type="submit" class="w-96 bg-red-500 hover:bg-red-700 inline-block rounded-full text-white py-2 px-4" name="delete_request">Delete</button>
                    </div>
                {% endif %}
            </div>
        </form>
    </div>
</div>
{% endblock %}
