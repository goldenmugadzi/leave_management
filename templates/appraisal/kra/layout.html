<!DOCTYPE html>
<html lang="en">
  {% load static %} {% load custom_tags %}
  <head>
    <!-- Select2 CSS -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="{% static 'assets/images/website-logo.png' %}"
    />
    <link
      type="text/css"
      href="{% static 'assets/css/tailwind.css' %}"
      rel="stylesheet"
    />
    <link
      type="text/css"
      href="{% static 'assets/css/be.css' %}"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
    />
    <link
      type="text/css"
      href="{% static 'assets/cdn/select2.min.css' %}"
      rel="stylesheet"
    />
    <link
      type="text/css"
      href="{% static 'assets/cdn/tailwind.min.css' %}"
      rel="stylesheet"
    />
    
    <script src="http://code.jquery.com/jquery-1.10.2.js"></script>
    <script src="http://code.jquery.com/ui/1.11.2/jquery-ui.js"></script>
    <script src="http://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>

    <script src="{% static 'assets/precalc.js' %}"></script>
    <script src="{% static 'assets/classification.js' %}"></script>
   
  </head>
  <body class="bg-gulf-blue-50">
    {% if messages %}
      <ul class="space-y-4 m-5">
        {% for message in messages %}
        <li
          id="message-{{ forloop.counter }}"
          class="border {% if message.tags == 'success' %}bg-green-100 border-green-400 text-green-700{% elif message.tags == 'info' %}bg-blue-100 border-blue-400 text-blue-700{% elif message.tags == 'warning' %}bg-yellow-100 border-yellow-400 text-yellow-700{% elif message.tags == 'danger' %}bg-red-100 border-red-400 text-red-700{% endif %} px-4 py-3 rounded relative"
          role="alert"
        >
          <span class="block sm:inline">{{ message }}</span>
          <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
            <svg
              class="fill-current h-6 w-6 text-red-500"
              role="button"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              onclick="document.getElementById('message-{{ forloop.counter }}').style.display='none';"
            >
              <title>Close</title>
              <path
                d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"
              />
            </svg>
          </span>
        </li>
        {% endfor %}
      </ul>
      {% endif %}
    {% block main %} {% endblock main %}
    {% block scripts %} {% endblock scripts %}  
  </body>
</html>
