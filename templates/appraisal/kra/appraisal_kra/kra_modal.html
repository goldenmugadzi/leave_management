{% load crispy_forms_tags %}
{% load static %}

<!-- Modal -->
<div id="addNewKra" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-end p-1">
            <button onclick="closeAddNewKra()" class="hover:bg-red-300 rounded p-1 text-white bg-red-500 rounded-lg">
                Close
            </button>
        </div>

        <div class="bg-gray-100 rounded-2xl m-1">
            <h2 class="p-4 text-xl font-bold">Create New Kra</h2>
        </div>

        <!-- Create New Kra form -->
        {% include 'appraisal/kra/create_update.html' %}
    </div>
</div>


<script>
    function openAddNewKra() {
        const modal = document.getElementById("addNewKra");
        modal.classList.remove("hidden");
    }

    function closeAddNewKra() {
        document.getElementById("addNewKra").classList.add("hidden");
    }
</script>
