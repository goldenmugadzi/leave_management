{% extends "admin_layout.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-4">
        <form method="post">
            {%csrf_token%}
            <div class="flex flex-col gap-6">
                <div class="flex gap-2">
                    <div 
                        class="flex-1 px-2 w-80 shadow-xl rounded-lg border-2"
                        >
                            {{ appraisal_kra_form.quarter|as_crispy_field }}
                    </div>
                    <div 
                        class="flex-1 px-2 w-80 shadow-xl rounded-lg border-2"
                        >
                            {{ appraisal_kra_form.activity_reference|as_crispy_field }}
                    </div>

                </div>
                
            </div>
            <div class="flex justify-center my-2">
                <button type="submit" class="w-96 bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4">Save</button>
            </div>
        </form>
         
</div>
{% endblock %}
