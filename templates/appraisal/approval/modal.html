{% load approval_stages %}

<!-- Modal (Hidden by Default) -->
<div id="ApprovalStageModal{{appraisal_id}}" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3">
        <h2 class="text-xl font-bold mb-4">{{modal_heading}}</h2>
        <p class="text-gray-600 mb-4">{{modal_description}}</p>
        
        <div class="bg-white shadow-md rounded-lg">
            {% with stage_data=appraisal_id|get_approval_stage_data %}
                {{stage_data}}
                {% include 'appraisal/approval/stage_info_progress.html' %}
            {% endwith %}
        </div>

        <div class="flex justify-end mt-2 mr-8">
            <button onclick="closeApprovalStageModal('{{appraisal_id}}')" class="px-4 py-2 text-white bg-red-500 rounded-lg">Close</button>
        </div>
    </div>
</div>

<script>
    function openApprovalStageModal(appraisal_id) {
        document.getElementById(`ApprovalStageModal${appraisal_id}`).classList.remove("hidden");
    }

    function closeApprovalStageModal(appraisal_id) {
        document.getElementById(`ApprovalStageModal${appraisal_id}`).classList.add("hidden");
    }
</script>
