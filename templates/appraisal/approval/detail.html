
<h1 class="text-center mb-4 font-bold text-xl  mb-2">Approval Workflow</h1>
<div class="flex items-center justify-center bg-gray-100">

    <div class="w-full max-w-xl">
        <div class="flex items-center justify-between">
            <!-- Step 1 -->
            {% for stage in stages %}
                <div class="relative flex-1 text-center">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full text-white font-bold bg-blue-500 mx-auto">
                        {{ stage.stage_num }}
                    </div>
                    <p class="mt-2 text-blue-500 font-semibold">{{ stage.stage_name }}</p>
                </div>

                <!-- Line -->
                {% if last_stage_num != stage.stage_num %}
                    <div class="flex-1 h-1 bg-blue-500"></div>
                {% endif %}
            {% endfor %}
            
        </div>
    </div>

</div>
