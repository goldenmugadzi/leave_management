{% extends "admin_layout.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}

    <div class="content-wrapper">
        <div class="grid grid-cols-1">
            <div class="bg-gray-50 shadow-lg rounded-lg p-6">
                <div class="flex justify-between">
                    <div>
                        <h1 class="font-bold text-2xl text-gray-900">My Qualifications and Experiences</h1>
                        <p class="text-sm text-gray-500">Set and update your qualifications and experiences</p>
                    </div>
                </div>
            </div>
            <div class="bg-white shadow-lg rounded-lg border-2 border-indigo-400 my-4 p-4">
                <!-- Tab Navigation -->
                <div class="bg-gray-100 rounded-lg p-1">
                    <ul class="flex flex-wrap gap-2 -mb-px text-md font-medium text-center">
                        <li class="mr-1 border-2 rounded-lg border-2 border-gray-400">
                            <button class="tab-button inline-block px-4 py-2 border-2 border-transparent rounded-md text-gray-600 bg-transparent hover:bg-gray-200 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 active shadow-sm" data-tab="qualifications" aria-selected="true">Qualifications</button>
                        </li>
                        <li class="mr-1 border-2 rounded-lg border-2 border-gray-400">
                            <button class="tab-button inline-block px-4 py-2 border-2 border-transparent rounded-md text-gray-600 bg-transparent hover:bg-gray-200 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2" data-tab="experience" aria-selected="false">Experience</button>
                        </li>
                    </ul>
                </div>
    
                <!-- Tab Content -->
                <div class="tab-content mt-6">
                    <!-- Qualifications Tab -->
                    <div id="qualifications" class="tab-pane active">
                        <div class="bg-white shadow-xl rounded-lg border-2 border-indigo-400 p-6">
                            <h3 class="text-lg font-semibold text-gray-900 mb-4">My Qualifications</h3>
                            
                        </div>
                    </div>
    
                    <!-- Experience Tab -->
                    <div id="experience" class="tab-pane hidden">
                        <div class="bg-white shadow-xl rounded-lg border-2 border-indigo-400 p-6">
                            <h3 class="text-lg font-semibold text-gray-900 mb-4">My Experiences</h3>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
        document.addEventListener('DOMContentLoaded', function () {
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabPanes = document.querySelectorAll('.tab-pane');

        tabButtons.forEach(button => {
            button.addEventListener('click', function () {
                // Remove active classes
                tabButtons.forEach(btn => {
                    btn.classList.remove('active', 'bg-white', 'text-indigo-600', 'border-indigo-500', 'shadow-sm');
                    btn.classList.add('text-gray-600', 'bg-transparent', 'border-transparent', 'hover:bg-gray-200', 'hover:text-gray-900');
                    btn.setAttribute('aria-selected', 'false');
                });
                tabPanes.forEach(pane => pane.classList.add('hidden'));

                // Add active class to clicked button and show corresponding pane
                this.classList.add('active', 'bg-white', 'text-indigo-600', 'border-indigo-500', 'shadow-sm');
                this.classList.remove('text-gray-600', 'bg-transparent', 'border-transparent', 'hover:bg-gray-200', 'hover:text-gray-900');
                this.setAttribute('aria-selected', 'true');
                const targetPane = document.getElementById(this.dataset.tab);
                targetPane.classList.remove('hidden');
            });
        });
    });
</script>
{% endblock %}
