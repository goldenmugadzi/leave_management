{% extends "admin_layout.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}

    <div class="content-wrapper">
        <div class="grid grid-cols-1">
            <div class="bg-gray-50 shadow-lg rounded-lg p-6">
                <div class="flex justify-between">
                    <div>
                        <h1 class="font-bold text-2xl text-gray-900">Qualification</h1>
                        <p class="text-md text-gray-500"><strong>{{user_object}}`s</strong> qualification</p>
                    </div>
                </div>

            </div>
            <div class="bg-white shadow-lg rounded-lg border-2 border-indigo-400 my-4 p-4">
                <form method="post" enctype="multipart/form-data">
                    {%csrf_token%}
                    {{user_qualification_form|crispy}}
                    <div class="flex justify-center my-2">
                        <button type="submit" class="w-96 bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" name="kra_request">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
