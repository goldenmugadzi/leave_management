{% extends "admin_layout.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block styles %} 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
{% endblock styles %}

{% block content %}

    <div class="content-wrapper">
        <div class="grid grid-cols-1">
            <div class="bg-gray-50 shadow-lg rounded-lg p-6">
                <div class="flex justify-between">
                    <div>
                        <h1 class="font-bold text-2xl text-gray-900">Experience</h1>
                        <p class="text-md text-gray-500"><strong>{{user_object}}`s</strong> experience</p>
                    </div>
                </div>

            </div>
            <div class="bg-white shadow-lg rounded-lg border-2 border-indigo-400 my-4 p-4">
                <form method="post">
                    {%csrf_token%}
                    {{user_experience_form|crispy}}
                    <div class="flex justify-center my-2">
                        <button type="submit" class="w-96 bg-blue-500 hover:bg-blue-700 inline-block rounded-full text-white py-2 px-4" name="kra_request">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}

    <script>
        flatpickr(".datepicker", {
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "F j, Y",
        allowInput: true
        });
    </script>

{% endblock %}
