{% extends "admin_layout.html" %}
{% load static %}
{% load tailwind_filters %}
{% block content %}
<div class="max-w-lg mx-auto p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6">New Signature Request</h2>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        
        <div class="mb-4">
            <label for="id_title" class="block text-sm font-medium text-gray-700">Title</label>
            {{ form | crispy }}
        </div>

        
            <div class="mb-4">
                <!-- Search input -->
                <div class="mt-1 relative">
                    <input id="user-search" type="search" autocomplete="off" placeholder="Search users by name or username..." class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2" />
                    <ul id="user-results" class="absolute z-20 left-0 right-0 bg-white border rounded-md mt-1 max-h-60 overflow-auto hidden"></ul>
                </div>

                <!-- Selected users (badges/rows) -->
                <div id="selected-users" class="mt-2 space-y-2"></div>

                <!-- Hidden select so the form posts signers as multiple values -->
                <select id="select-signers" name="signers" multiple  style="display:none;">
                    {% for i in form.signers.field.choices %}
                        <option value="{{ i.value }}">{{ i.label }}</option>
                    {% endfor %}
                </select>
            </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition duration-150">Submit Request</button>
    </form>

</div>

<script>
 
    document.querySelector('form').addEventListener('submit', function(event) {
        const hiddenSelect = document.getElementById('select-signers');
        const selectedValues = Array.from(hiddenSelect.options).map(option => option.value);
        
        if (selectedValues.length === 0) {
            alert("Please select at least one signer.");
            event.preventDefault(); // Prevent form submission
        }
    });   document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('user-search');
        const resultsList = document.getElementById('user-results');
        const selectedContainer = document.getElementById('selected-users');
        const hiddenSelect = document.getElementById('select-signers');

        const userSearchUrl = "{% url 'docusign:user_search' %}";

        // simple debounce
        function debounce(fn, delay) {
            let t;
            return function(...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        function clearResults() {
            resultsList.innerHTML = '';
            resultsList.classList.add('hidden');
        }

        function renderResultItem(user) {
            const li = document.createElement('li');
            li.className = 'px-3 py-2 hover:bg-gray-100 cursor-pointer flex items-center gap-3';
            const div = document.createElement('div');
            const title = document.createElement('div');
            title.className = 'font-medium text-sm';
            title.textContent = user.text;
            const desc = document.createElement('div');
            desc.className = 'text-xs text-gray-500';
            desc.textContent = user.description || '';
            div.appendChild(title);
            div.appendChild(desc);
            li.appendChild(div);
            li.dataset.userId = user.id;
            li.dataset.userText = user.text;
            return li;
        }

        function addSelectedUser(id, text, icon) {
            // prevent duplicates
            if (hiddenSelect.querySelector(`option[value="${id}"]`)) return;

            // add option to hidden select
            const opt = document.createElement('option');
            opt.value = id;
            opt.text = text;
            opt.selected = true;
            hiddenSelect.appendChild(opt);

            // add badge in selected container
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between border rounded-md p-2';
            row.dataset.userId = id;
            const left = document.createElement('div');
            left.className = 'flex items-center gap-3';
            const name = document.createElement('div');
            name.className = 'font-medium';
            name.textContent = text;
            left.appendChild(name);
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'bg-red-500 text-white px-2 py-1 rounded ml-3';
            btn.textContent = 'Remove';
            btn.addEventListener('click', function(){
                // remove option and row
                const val = row.dataset.userId;
                const o = hiddenSelect.querySelector(`option[value="${val}"]`);
                if (o) o.remove();
                row.remove();
            });
            row.appendChild(left);
            row.appendChild(btn);
            selectedContainer.appendChild(row);
        }

        async function doSearch(q) {
            if (!q || q.length < 1) { clearResults(); return; }
            try {
                const res = await fetch(userSearchUrl + '?q=' + encodeURIComponent(q));
                if (!res.ok) { clearResults(); return; }
                const data = await res.json();
                const items = data.results || [];
                resultsList.innerHTML = '';
                if (!items.length) { clearResults(); return; }
                items.forEach(u => {
                    const li = renderResultItem(u);
                    li.addEventListener('click', function(){
                        addSelectedUser(u.id, u.text, u.icon);
                        clearResults();
                        searchInput.value = '';
                    });
                    resultsList.appendChild(li);
                });
                resultsList.classList.remove('hidden');
            } catch(err) {
                console.error('user search error', err);
                clearResults();
            }
        }

        const debouncedSearch = debounce(function(e) { doSearch(e.target.value); }, 250);
        searchInput.addEventListener('input', debouncedSearch);

        // click outside to close
        document.addEventListener('click', function(e){
            if (!e.target.closest('#user-results') && !e.target.closest('#user-search')) {
                clearResults();
            }
        });
    });
</script>
{% endblock %}
