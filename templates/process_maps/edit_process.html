<!--users/templates/users/add_user.html-->

{% extends 'admin_layout.html' %} {% block content %}

<div class="content-wrapper">
  
  <div class="bg-gulf-blue-100 shadow shadow-gulf-blue-200 text-gray-900 rounded px-2 py-2">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="space-y-12 px-5 py-5">

        <div class="mt-10 border-b border-gray-900/10 pb-12">
          <h2 class="text-base font-semibold leading-7 text-gray-900">
            File Information
          </h2>
          <p class="mt-1 text-sm leading-6 text-gray-600">
            Fill all required fields.
          </p>

          <div class="mt-10 grid grid-cols-3 gap-4">
            <input
            type="hidden"
            name="id"
            value="{{record.id}}"
          />
            <div>
              <label
                for="file_name"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Process Name</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="file_name"
                  value="{{record.filename}}"
                  id="file_name"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-2 px-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>

           
            <div>
              <label
                for="section"
                class="block text-sm font-medium leading-6 text-gray-900"
                >File Category</label
              >
              <div class="mt-2">
                <select
                  id="filetype"
                  name="filetype"
                  autocomplete="category_id"
                  class="block w-full rounded-md border-0 py-2 px-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  {% if record.filetype_id %}
                    <option value="{{ record.filetype_id.id }}">{{ record.filetype_id.name }}</option>
                  {%endif%}
                  <option value="">Select File Category</option>
                  {% for option in filetypes %}
                    <option value="{{ option.id }}">{{ option.name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div
            id="subtype1">
              <label
                for="subtype"
                class="text-sm font-medium leading-6 text-gray-900"
                >Subtype</label
              >
              <div class="mt-2">
                <select
                id="subtype"
                name="subtype"
                autocomplete="subtype"
                class="block w-full rounded-md border-0 py-2 px-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
              >
              {% if record.filesubtype_id %}
                <option value="{{ record.filesubtype_id.id }}">{{ record.filesubtype_id.name }}</option>
              {%endif%}
              </select>
              </div>
            </div>

            <div
            id="subtype2">
              <label
                for="subsubtype"
                class="text-sm font-medium leading-6 text-gray-900"
                >Subsubtype</label
              >
              <div class="mt-2">
                <select
                id="subsubtype"
                name="subsubtype"
                autocomplete="subsubtype"
                class="block w-full rounded-md border-0 py-2 px-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
              >
              {% if record.subsubtype_id %}
                <option value="{{ record.subsubtype_id.id }}">{{ record.subsubtype_id.name }}</option>
              {%endif%}
              </select>
              </div>
            </div>

            <div>
                <label
                  for="uploaded_file"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Upload File</label
                >
                <div class="mt-2">
                  <input
                    type="file"
                    name="uploaded_file"
                    id="uploaded_file"
                    autocomplete="family-name"
                    class="block w-full rounded-md border-0 py-2 px-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                  />
                </div>
              </div>
  
              <div>
                <label
                  for="region"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Region</label
                >
                <div class="mt-2">
                  <select
                    id="region"
                    name="region"
                    autocomplete="region"
                    class="block w-full rounded-md border-0 py-2 px-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                  >
                    {% if record.region_id %}
                      <option value="{{ record.region_id.id }}">{{ record.region_id.region }}</option>
                    {%endif%}
                    <option>Select Region</option>
                    {% for region in regions %}
                      <option value="{{ region.id }}">{{ region.region }}</option>
                    {% endfor %}
                  </select>
                </div>
              </div>

          </div>
        </div>
      </div>

      <div class="flex mt-10 px-3 py-3">
        <div style="width: 50%;" class="text-center">
          <a href="/processes/table" style="width: 100%;" class="px-3 py-2 text-center text-sm font-semibold leading-6 text-gray-900">
            CANCEL
          </a>
        </div>
        <div style="width: 50%;">
          <button
          style="width: 100%;"
            type="submit"
            class="rounded-md bg-gulf-blue-900 hover:bg-gulf-blue-550 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
          >
            UPDATE
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script>
  $("#filetype").change(function() {
    var selectedValue = $(this).val();
    var fileType = document.getElementById("filetype").value;
    $.ajax({
      url: '/processes/subtype/get/'+ selectedValue,
      type: 'GET',
      success: function(data) {
          var secondCategory = document.getElementById("subtype");
          // Clear existing options
          secondCategory.options.length = 0;

          // Add new options based on data
          for (var option of data.subtypes) {
              var opt = new Option(option.name, option.id);
              secondCategory.add(opt);
          }
      }
    });
  });
  $("#subtype").change(function() {
    var selectedValue = $(this).val();
    var fileType = document.getElementById("subtype").value;
    $.ajax({
      url: '/processes/subsubtype/get/'+ selectedValue,
      type: 'GET',
      success: function(data) {
          var secondCategory = document.getElementById("subsubtype");
          // Clear existing options
          secondCategory.options.length = 0;

          // Add new options based on data
          for (var option of data.subsubtypes) {
              var opt = new Option(option.name, option.id);
              secondCategory.add(opt);
          }
      }
    });
  });
</script>
{% endblock scripts %}
