<!--users/templates/users/add_user.html-->

{% extends 'admin_layout.html' %} {% block content %}

<div class="content-wrapper">
  
  <div class="bg-gulf-blue-100 shadow shadow-gulf-blue-200 text-gray-900 rounded px-2 py-2">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="space-y-12 px-5 py-5">

        <div class="mt-10 border-b border-gray-900/10 pb-12">
          <h2 class="text-base font-semibold leading-7 text-gray-900">
            File Information
          </h2>
          <p class="mt-1 text-sm leading-6 text-gray-600">
            Fill all required fields.
          </p>

          <div class="mt-10 grid grid-cols-3 gap-4">
            
            <div>
              <label
                for="file_name"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Process Map Name</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="file_name"
                  id="file_name"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>

           
            <div>
              <label
                for="section"
                class="block text-sm font-medium leading-6 text-gray-900"
                >File Type</label
              >
              <div class="mt-2">
                <select
                  id="category_id"
                  name="category_id"
                  autocomplete="category_id"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  <option value="">Select Process Map Category</option>
                  <option value="ENGINEERING">ENGINEERING</option>
                  <option value="COMMERCIAL">COMMERCIAL</option>
                  <option value="FINANCE">FINANCE</option>
                  <option value="HUMAN RESOURCES">HUMAN RESOURCES</option>
                  <option value="ICT">ICT</option>
                  <option value="RISK MANAGEMENT">RISK MANAGEMENT</option>
                  <option value="PROCUREMENT">PROCUREMENT</option>
                  <option value="LEGAL SERVICES">LEGAL SERVICES</option> 
                  <option value="PUBLIC RELATIONS">PUBLIC RELATIONS</option> 

                  
            </select>
                
              </div>
            </div>

            <div
            id="subtypel">
              <label
                for="subtype"
                class="text-sm font-medium leading-6 text-gray-900"
                >Sub type</label
              >
              <div class="mt-2">
                <select
                id="subtype"
                name="subtype"
                autocomplete="category_id"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
              >
              
              </select>
              </div>
            </div>


            <div>
                <label
                  for="uploaded_file"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Upload File</label
                >
                <div class="mt-2">
                  <input
                    type="file"
                    name="uploaded_file"
                    id="uploaded_file"
                    autocomplete="family-name"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                  />
                </div>
              </div>
  
              <div>
                <label
                  for="region"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Region</label
                >
                <div class="mt-2">
                  <select
                    id="region"
                    name="region"
                    autocomplete="region"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                  >
                    <option>Select Region</option>
                    <option value="Harare Region">Harare Region</option>
                    <option value="Eastern Region">Eastern Region</option>
                    <option value="Southern Region">Southern Region</option>
                    <option value="Westen Region">Westen Region</option>
                    <option value="Transmission west Region">Transmission west Region</option>
                    <option value="Transmission south Region">Transmission south Region</option>
                  </select>
                </div>
              </div>

          </div>
        </div>
      </div>

      <div class="flex mt-10 px-3 py-3">
        <div style="width: 50%;">
          <button style="width: 100%;" class="text-sm font-semibold leading-6 text-gray-900">
            CANCEL
          </button>
        </div>
        <div style="width: 50%;">
          <button
          style="width: 100%;"
            type="submit"
            class="rounded-md bg-gulf-blue-900 hover:bg-gulf-blue-550 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
          >
            SAVE FILE
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script>
 // Get references to the parent and child select elements
const parentSelect = document.getElementById("category_id");
const childSelect = document.getElementById("subtype");
const childSelect1 = document.getElementById("subtypel");

// Add event listener to the parent select element
parentSelect.addEventListener("change", function() {
  // Get the selected value of the parent select
  const selectedValue = parentSelect.value;

  // Check if a value is selected
  if (selectedValue !== "") {
    // Show the child select element
    childSelect.style.display = "block";
    childSelect1.style.display = "block";

    // Update child select options based on the selected parent value (modify this logic based on your specific needs)
    childSelect.options.length = 0; // Clear existing options
    if (selectedValue === "ENGINEERING") {
      const option1 = document.createElement("option");
      option1.value = "Planning processes";
      option1.text = "Planning processes";
      childSelect.add(option1);

      const option2 = document.createElement("option");
      option2.value = "Maintenance processes";
      option2.text = "Maintenance processes";
      childSelect.add(option2);

      const option3 = document.createElement("option");
      option3.value = "Project processes";
      option3.text = "Project processes";
      childSelect.add(option3);
    } else if (selectedValue === "COMMERCIAL") {
      const option4 = document.createElement("option");
      option4.value = "Client processes";
      option4.text = "Client processes";
      childSelect.add(option4);

      const option5 = document.createElement("option");
      option5.value = "Revenue assuarance processes";
      option5.text = "Revenue assuarance processes";
      childSelect.add(option5);

      const option6 = document.createElement("option");
      option6.value = "Payment processes";
      option6.text = "Payment processes";
      childSelect.add(option6);
    } else {
      // Handle other options if needed
    }
  } else {
    // Hide the child select element if no value is selected
    childSelect.style.display = "none";
    childSelect1.style.display = "none";
  }
});

// Initially hide the child select element
childSelect.style.display = "none";
childSelect1.style.display = "block";


</script>
{% endblock scripts %}
