<!DOCTYPE html>
<html>
<head>
    <title>PDF Viewer</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .pdf-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pdf-container embed {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="pdf-container">
        <embed src="{{ pdf_path }}" type="application/pdf">
    </div>
</body>
</html>
