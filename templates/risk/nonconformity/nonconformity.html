<script>

$(document).ready(function(){
$('#accepted').hide();
$('#rejected').hide();

$('#accept-btn').click(function(){
$('#accepted').show();
$('#cause').attr('required','required');
$('#corrective-action').attr('required','required');
$('#estimated-completion-date').attr('required','required');
$('#normal').hide();
});




$('#save-btn').click(function(){
let cause=$('#cause').val();
let corrective_action=$('#corrective-action').val();
let estimated_completion_date=$('#estimated-completion-date').val();
if(cause.trim()===''){
  alert('Please enter NC cause!');
}
else if(corrective_action.trim()===''){
  alert('Please enter corrective action for this NC!');
}else if(estimated_completion_date.trim()===''){
  alert('Please enter estimated completion date for this NC!');
}
else{
  let response = confirm("Are you sure you want to save this NC?");
  if (response === false) {
				return;
			} else {
				let url='saved.php';
        return $.post(
          url, { cause: $('#cause').val(), corrective_action: $('#corrective-action').val(),estimated_completion_date: $('#estimated-completion-date').val()},
         function(status){
          alert('NC saved succesfully.');
          window.location='new.php';
        } 
        );
			}
}		
});

$('#accepted-back-btn').click(function(){
$('#accepted').hide();
$('#normal').show();
});

$('#reject-btn').click(function(){
$('#rejected').show();
$('#reason-for-rejection').attr('required','required');
$('#normal').hide();
});


$('#reject-send-btn').click(function(){
$('#reason-for-rejection').prop('required',true);
let reason=$('#reason-for-rejection').val();
if(reason===''){
  alert('Please enter reason for rejecting this NC!');
}else{
  let response = confirm("Are you sure you want to reject this NC?");
			if (response === false) {
				return;
			} else {
				return window.location='reject.php?reason='+ reason;
			}
}
});



});
</script>
