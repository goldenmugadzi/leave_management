{% extends "admin_layout.html" %}{% load static %}
{% block content %}
<div class=" m-auto mt-5  ">
  <form class="row rounded py-4 border  bg-gulf-blue-100 p-3 m-auto text-center   container" method="POST" action="" enctype="multipart/form-data">
    {% csrf_token %}
   <div class=" m-auto container justify-content-stretch align-content-stretch ">
    <div class="mt-10 grid grid-cols-2 gap-4">
      {% for field in form %}
      <div>
        {% if field.is_hidden %}
          {{ field }}
        
        {% else %}
          <div class="m-auto text-center grid grid-cols-2 pr-5">
            <div>
              {{ field.label }}
              <div class="text-blue-500">{{ field.help_text }}</div>
              <div class="text-red-500 text-red-500">{{ field.errors }}</div>
            </div>
            {{ field }}
          </div>
        {% endif %}
      </div>
    {% endfor %}
    <div class="rounded grid grid-cols-2 pr-5">
      <div>
        <p class="text-center">Attachments</p>
      </div>
      <input name="attachments" type="file" multiple class="block w-full rounded-md border-0 py-1.5 mb-3 flex justify-center items-align-center text-gray-900 shadow-sm ring-1 ring-inset form-control-file" />
    </div></div>
     <br>
    <div class="m-auto justify-content-stretch align-content-stretch">
      <input class="bg-gulf-blue-600 hover:bg-gulf-blue-500 text-white font-bold py-2 px-4 rounded" type="submit" value="Submit">
    </div>
  </form>
</div>
{% endblock content %}
