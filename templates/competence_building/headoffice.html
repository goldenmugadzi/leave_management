{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([


    [{'v':'MD', 'f':'<div style="color:Black; font-style:bold">MANAGING DIRECTOR</div>'},
    '', 'The Managing Director'],
   [{'v':'Commercial Manager', 'f':'<div style="color:black; font-style:bold">COMMERCIAL MANAGER</div>'},
    'MD', ''],
    [{'v':'DM Sub', 'f':'<div></div>'},
    'MD', ''],
   [{'v':'District Manager', 'f':'<div style="color:black; font-style:bold">DISTRICT MANAGER</div>'},
    'DM Sub', ''],
    [{'v':'Risk Sub', 'f':'<div></div>'},
    'MD', ''],
    [{'v':'Risk Sub2', 'f':'<div></div>'},
    'Risk Sub', ''],
   ['CHIEF RISK OFFICER', 'Risk Sub2', ''], 
   [{'v':'Procurement Sub', 'f':'<div></div>'},
   'MD', ''],
   [{'v':'Procurement Sub2', 'f':'<div></div>'},
   'Procurement Sub', ''],
   ['PROCUREMENT OFFICER', 'Procurement Sub2', ''],    
   [{'v':'Jim', 'f':'<div style="color:black; font-style:bold">ENGINEERING MANAGER</div>'},
    'MD', 'VP'],
   [{'v':'IT Sub', 'f':'<div></div>'},
   'MD', ''],
   [{'v':'IT Sub2', 'f':'<div></div>'},
   'IT Sub', ''],
   [{'v':'Information Technology', 'f':'<div style="color:black; font-style:bold">SYSTEMS ADMINISTARTOR</div>'},
   'IT Sub2', ''],
   [{'v':'HR Sub', 'f':'<div></div>'},
   'MD', ''],
  [{'v':'HR Manager', 'f':'<div style="color:black; font-style:bold">HR MANAGER</div>'},
   'HR Sub', ''],
   [{'v':'Finance Manager', 'f':'<div style="color:black; font-style:bold">FINANCE MANAGER</div>'},
   'MD', ''],
 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});
  }
</script>
{% endblock %}
{%block content%}

<div>
      <div id="chart_div"></div>
</div>

{%endblock%}
