{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([


    [{'v':'MD', 'f':'<div style="color:Black; font-style:bold">MANAGING DIRECTOR</div>'},
    '', 'The Managing Director'],
   [{'v':'CD', 'f':'<div style="color:black; font-style:bold">COMMERCIAL DIRECTOR</div>'},
    'MD', 'Commercial Director'],
    
   [{'v':'TDD', 'f':'<div style="color:black; font-style:bold">TRANSMISSION AND DISTRIBUTION DIRECTOR</div>'},
    'MD', 'Transmission'],
  
   [{'v':'SEC', 'f':'<div style="color:black; font-style:bold">COMPANY SECRETARY</div>'},
    'MD', 'Secretary'],
 
   [{'v':'ICT', 'f':'<div style="color:black; font-style:bold">SENIOR MANAGERS (IT. I R&D</div>'},
   'MD', 'ICT, Innovation, Research and development'],

  [{'v':'HR Manager', 'f':'<div style="color:black; font-style:bold">SENIOR MANAGER HUMAN RESOURCE</div>'},
   'MD', 'Human and Admin Resource'],

   [{'v':'FD', 'f':'<div style="color:black; font-style:bold">FINANCE DIRECTOR</div>'},
   'MD', 'Finance Management'],
   [{'v':'GM', 'f':'<div style="color:black; font-style:bold">GENERAL MANAGERx5 (chart D4.1)</div>'},
   'MD', 'regional Managers'],
   [{'v':'SCM', 'f':'<div style="color:black; font-style:bold">SUPPLY CHAIN MANAGER </div>'},
   'MD', 'supply chain'],
   [{'v':'RO', 'f':'<div style="color:black; font-style:bold">RISK OFFICER </div>'},
   'MD', 'regional Managers'],
   [{'v':'PA', 'f':'<div style="color:black; font-style:bold">PERSONAL ASSISTANT </div>'},
   'MD', 'Assistant'],

 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});
 

  }
</script>
{% endblock %}
{%block content%}

<div>
    
    <div id="chart_div"></div>
</div>

{%endblock%}
