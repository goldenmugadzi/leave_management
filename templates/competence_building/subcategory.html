{% extends "admin_layout.html" %}
{% load static %}

{% block content %}

<div class="m-auto mt-5 container">
    <div class="mt-10 grid grid-cols-3 gap-5">
      {% for subcategory in subcategories %}
      <li>{{ subcategory.name }} (Category: {{ subcategory.category.name }})</li>
      <div class="sm:flex rounded {% cycle 'bg-green-200' 'bg-blue-200' %} lg:items-center lg:justify-between">
        <div class="min-w-0 flex-1">
            <div class="mx-auto">
              <div class="group relative">
                <div>
                    <a {% if subcategory.name == 'Job Description' %} 
                    href="/competence/jobdescription "
                    {% else %}
                    href="/competence/{{subcategory.id}}/files "
                    {% endif %}
                     class="flex justify-center rounded-md py-8 px-3 text-black text-2xl">
                   

                    <strong>
                      {{ subcategory }}
                    </strong>
                  </a>
                </div>
            </div>
          </div>
        </div>
      </div>
     
      {% endfor %}
 </div>
</div>

{% endblock %}
