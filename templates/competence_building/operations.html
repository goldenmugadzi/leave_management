{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvg/1.5/canvg.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([



    [{'v':'OPPS', 'f':'<div style="color:black; font-style:bold">OPERATIONS AND MAINTANANCE ENGINEER</div>'},
    '', 'Operations and maintanance'],
    
    [{'v':'SEO', 'f':'<div style="color:black; font-style:bold">SENIOR ENGINEER OPERATIONS</div>'},
    'OPPS', 'Operations and maintanance'],
    [{'v':'SEM', 'f':'<div style="color:black; font-style:bold">SENIOR ENGINEER MAINTANANCE</div>'},
    'OPPS', 'Operations and maintanance'],
    [{'v':'SSC', 'f':'<div style="color:black; font-style:bold">SENIOR SYSTEMS CONTROLLER x 10</div>'},
    'SEO', 'Operations and maintanance'],
    [{'v':'SFPM', 'f':'<div style="color:black; font-style:bold">SENIOR FOREPERSON MAINTANANCE</div>'},
    'SEM', 'Operations and maintanance'],
    [{'v':'SFPS', 'f':'<div style="color:black; font-style:bold">SENIOR FOREPERSON SUBSTATION</div>'},
    'SEM', 'Operations and maintanance'],
    [{'v':'AL', 'f':'<div style="color:black; font-style:bold">ARTISAN LINE</div>'},
    'SFPM', 'Operations and maintanance'],
    [{'v':'APC', 'f':'<div style="color:black; font-style:bold">ARTISAN (POWER CABLES)</div>'},
    'SFPM', 'Operations and maintanance'],
    [{'v':'AAL', 'f':'<div style="color:black; font-style:bold">ARTISAN ASSISTANT LINE</div>'},
    'AL', 'Operations and maintanance'],
    [{'v':'LW', 'f':'<div style="color:black; font-style:bold">LINE WORKER x 4</div>'},
    'AL', 'Operations and maintanance'],
    [{'v':'AA', 'f':'<div style="color:black; font-style:bold">ARTISAN ASSISTANT x 8</div>'},
    'APC', 'Operations and maintanance'],
    [{'v':'GC', 'f':'<div style="color:black; font-style:bold">GANG CHARGE</div>'},
    'SFPS', 'Operations and maintanance'],
    [{'v':'TECN', 'f':'<div style="color:black; font-style:bold">TECHNICIAN X 5</div>'},
    'SFPS', 'Operations and maintanance'],
    [{'v':'WRK', 'f':'<div style="color:black; font-style:bold">WORKER x 5</div>'},
    'GC', 'Operations and maintanance'],
    [{'v':'GC', 'f':'<div style="color:black; font-style:bold">ASSISTANAT TECHNICIAN</div>'},
    'TECN', 'Operations and maintanance'],

 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});

    document.getElementById('download_button').addEventListener('click', function() {
      var chartContainer = document.getElementById('chart_div');
      var chartImage = chartContainer.getElementsByTagName('table')[0].outerHTML;

      // Create a temporary canvas element to draw the chart as an image
      var canvas = document.createElement('canvas');
      canvas.width = chartContainer.offsetWidth;
      canvas.height = chartContainer.offsetHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawSvg(chartImage, 0, 0, canvas.width, canvas.height);

      // Convert canvas to PDF using html2pdf library
      var canvasDataUrl = canvas.toDataURL('image/png');
      var pdfOptions = {
          filename: 'Operations_&_Maintanance_Chart.pdf',
          image: { type: 'png', data: canvasDataUrl },
          html2canvas: { scale: 2 },
  jsPDF: { format: 'a4', orientation: 'landscape' } // Adjust page size here

      };
      html2pdf().set(pdfOptions).from(chartContainer).save();

  })



  }
</script>
{% endblock %}
{%block content%}

<div>
  <a href="#" id="download_button" style="text-color:blue"  class="download-button">Download Chart</a>
  <div id="chart_div" class="py-10 px-5"></div>
</div>

{%endblock%}
