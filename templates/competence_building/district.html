{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([

   
  
    [{'v':'CD', 'f':'<a href = "chitowndistrict"<div style="color:black; font-style:bold">CHITUNGWIZA_DISTRICT</div></a>'},
    '', 'chitungwiza District'],

    [{'v':'ED', 'f':'<a href = "eastdistrict"<div style="color:black; font-style:bold"> EAST_DISTRICT </div></a>'},
    '', 'East District'],
    
    [{'v':'ND', 'f':'<a href = "northdistrict"<div style="color:black; font-style:bold"> NORTH_DISTRICT </div></a>'},
    '', 'North District'],
    [{'v':'SD', 'f':'<a href = "southdistrict"<div style="color:black; font-style:bold"> SOUTH_DISTRICT </div></a>'},
    '', 'south District'],

  

 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});
  }

</script>

{% endblock %}
{%block content%}

<div>
  <div style="text-color:blue"  class="download-button"><STRONG> HARARE REGION - DISTRICTS AND DEPARTMENTS 2016</STRONG> </div>
  <div id="chart_div" class = "py-6 px-3 grid grid-cols-4 "></div>
</div>

{%endblock%}
