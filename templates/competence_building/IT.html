{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvg/1.5/canvg.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([


    [{'v':'SA', 'f':'<div style="color:Black; font-style:bold">SYSTEMS ADMINISTATOR (1)</div>'},
    '', 'Information Technology'],
   [{'v':'Support Officer', 'f':'<div style="color:black; font-style:bold">SYSTEMS SUPPORT OFFICER EAST (1)</div>'},
    'SA', ''],
    [{'v':'SOE', 'f':'<div style="color:black; font-style:bold">SYSTEMS SUPPORT OFFICER NORTH (1)</div>'},
    'SA', ''],
    [{'v':'Support Officer1', 'f':'<div style="color:black; font-style:bold">SYSTEMS SUPPORT OFFICER SOUTH (1)</div>'},
    'SA', ''],
    [{'v':'Support Officer2', 'f':'<div style="color:black; font-style:bold">SYSTEMS SUPPORT OFFICER CHITUNGWIZA (1)</div>'},
    'SA', ''],
   [{'v':'Hardware technician', 'f':'<div style="color:black; font-style:bold">HARDWARE TECHNICIAN  (2)</div>'},
    'SA', ''],
    [{'v':'Assistant Hardware technician', 'f':'<div>ASSISTANT HARDWARE TECHNICIAN (2)</div>'},
    'Hardware technician', ''],
    [{'v':'', 'f':'<div></div>'},
    '', ''],
 
 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});

   
    
  }
</script>
{% endblock %}
{%block content%}

<div>
  <div style="text-color:blue font-size:14pt"><strong>CHART D4.11 HARARE REGION - IT SERVICES 2016</strong></div>
  <div id="chart_div" class="py-10 px-5"></div>
</div>


{%endblock%}
