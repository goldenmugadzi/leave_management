{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([



    [{'v':'ES', 'f':'<a href = "eastsales"<div style="color:black; font-style:bold">EAST DISTRICT SALES</div></a>'},
    '', 'East District'],
    [{'v':'ER', 'f':'<a href = "eastruwa"<div style="color:black; font-style:bold">EAST DISTRICT RUWA</div></a>'},
    '', 'East District'],
    [{'v':'EM', 'f':'<a href = "eastmabvuku"<div style="color:black; font-style:bold">EAST DISTRICT MABVUKU</div></a>'},
    '', 'East District'],
    [{'v':'ED', 'f':'<a href = "eastdistrict"<div style="color:black; font-style:bold">EAST DISTRICT ENGINEERING</div></a>'},
    '', 'East District'],
    [{'v':'ECBD', 'f':'<a href = "eastcbd"<div style="color:black; font-style:bold">EAST DISTRICT CBD</div></a>'},
    '', 'East District'],
    [{'v':'EB', 'f':'<a href = "eastborrowdale"<div style="color:black; font-style:bold">EAST DISTRICT BORROWDALE</div></a>'},
    '', 'East District'],
  
 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});
  }

</script>

{% endblock %}
{%block content%}

<div>
  <div style="text-color:blue"  class="download-button">CHART D4.5 HARARE REGION - EAST DISTRICT </div>
  <div id="chart_div" class="py-10 px-5"></div>
</div>

{%endblock%}
