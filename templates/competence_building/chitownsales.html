{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<style>
  .google-visualization-orgchart-linebottom {
    border-bottom: 1px solid #3388dd;
    height: 2rem;
}
.google-visualization-orgchart-lineleft {
  border-left: 1px solid #3388dd;
  height: 2rem;
}
  </style>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([



    [{'v':'SE', 'f':'<div style="color:black; font-style:bold">SALES EXECUTIVE (1)</div>'},
    '', 'District'],
    [{'v':'AOR', 'f':'<div style="color:black; font-style:bold">ACCOUNTING OFFICER REVENUE ASSURANCE (1)</div>'},
    'SE', 'District'],
    [{'v':'AAC', 'f':'<div style="color:black; font-style:bold">ACCOUNTING CLERK (1)</div>'},
    'AOR', 'District'],
    [{'v':'AOC', 'f':'<div style="color:black; font-style:bold">ACCOUNTING OFFICER COSTING (1)</div>'},
    'SE', 'District'],
    [{'v':'AC', 'f':'<div style="color:black; font-style:bold">ACCOUNTING CLERK (1)</div>'},
    'AOC', 'District'],
    [{'v':'SK', 'f':'<div style="color:black; font-style:bold">STOREKEEPER(1)</div>'},
    'AOC', 'District'],

    [{'v':'AOC', 'f':'<div style="color:black; font-style:bold">ACCOUNTING OFFICER CASH (1)</div>'},
    'SE', 'District'],
    [{'v':'SA', 'f':'<div style="color:black; font-style:bold"> STORES ASSISTANT (1)</div>'},
    'SK', 'District'],
    [{'v':'COM', 'f':'<div style="color:black; font-style:bold"> COMMISSIONNAIRE (1) (1)</div>'},
    'SE', 'District'],
    [{'v':'CS', 'f':'<div style="color:black; border-dashed: 4px font-style:bold">COMMERCIAL SUPERVISOR (1)</div>'},
    'SE', 'District'],

   
 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});

  
  }
</script>
{% endblock %}
