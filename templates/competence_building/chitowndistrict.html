{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([


    
 
    [{'v':'CZ', 'f':'<a href = "chitownzengeza"<div style="color:black; font-style:bold">CHITUNGWIZA DISTRICT ZENGEZA</div></a>'},
    '', 'CHitown District'],
    [{'v':'CS', 'f':'<a href = "chitownseke"<div style="color:black; font-style:bold">CHITUNGWIZA DISTRICT SEKE</div></a>'},
    '', 'CHitown District'],
    [{'v':'CSL', 'f':'<a href = "chitownsales"<div style="color:black; font-style:bold">CHITUNGWIZA DISTRICT COMMERCIAL</div></a>'},
    '', 'CHitown District'],
    [{'v':'CDT', 'f':'<a href = "chitownengineering"<div style="color:black; font-style:bold">CHITUNGWIZA DISTRICT</div></a>'},
    '', 'CHitown District'],

 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});
  }

</script>
