{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<style>
  .google-visualization-orgchart-linebottom {
    border-bottom: 1px solid #3388dd;
    height: 2rem;
}
.google-visualization-orgchart-lineleft {
  border-left: 1px solid #3388dd;
  height: 2rem;
}
  </style>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">

  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([



    [{'v':'CM', 'f':'<div style="color:black; font-style:bold">COMMERCIAL MANAGER (1)</div>'},
    '', 'Commercial'],

   [{'v':'SECRETARY ', 'f':'<div style="color:black; font-style:bold">COMMERCIAL SECRETARY (1)</div>'},
    'CM', 'Commercial'],
    [{'v':'CE', 'f':'<div style="color:black; font-style:bold">COMMERCIAL ENGINEER (1)</div>'},
    'CM', 'ENGINEERING'],
    [{'v':'MO', 'f':'<div style="color:black; font-style:bold">MARKETING OFFICER (1)</div>'},
    'CM', 'Marketing, commercial'],
    [{'v':'SA', 'f':'<div style="color:black; font-style:bold">SALES ANALYST (1)</div>'},
    'CM', 'Commercial'],
    [{'v':'SE', 'f':'<a href="sales"> <div style="color:black;  border: dashed 2px gray; font-style:bold">SALES EXECUTIVE (1)</div></a>'},
    'CM', 'Commercial'],
    [{'v':'ET', 'f':'<div style="color:black; font-style:bold">ENERGY TECHNICIAN (2)</div>'},
    'CE', 'Commercial'],
 

 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});


  }
</script>
{% endblock %}
{%block content%}

<div>
   
  <div style="text-color:blue; font-size:14pt"><strong>CHART D4.10 HARARE REGION - COMMERCIAL 2016</strong></div>
  <div id="chart_div" class="py-10 px-5"></div>
</div>

{%endblock%}
