{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([


    
 
    [{'v':'NW', 'f':'<a href = "northwarrenpark"<div style="color:black; font-style:bold">NORTH DISTRICT WARENPARK</div></a>'},
    '', 'North District'],
    [{'v':'NS', 'f':'<a href = "northsales"<div style="color:black; font-style:bold">NORTH DISTRICT SALES</div></a>'},
    '', 'North District'],
    [{'v':'NM', 'f':'<a href = "northmabelreign"<div style="color:black; font-style:bold">NORTH DISTRICT MABELREIGN</div></a>'},
    '', 'North District'],
    [{'v':'NK', 'f':'<a href = "northkuwadzana"<div style="color:black; font-style:bold">NORTH DISTRICT KUWADZANA</div></a>'},
    '', 'North District'],
    [{'v':'ND', 'f':'<a href = "northengineering"<div style="color:black; font-style:bold">NORTH DISTRICT ENGINEERING</div></a>'},
    '', 'North District'],

 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});
  }

</script>

{% endblock %}
