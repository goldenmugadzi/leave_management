{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvg/1.5/canvg.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([



    [{'v':'SE', 'f':'<div style="color:black; font-style:bold">SALES EXECUTIVE</div>'},
    '', 'District'],
    [{'v':'AOR', 'f':'<div style="color:black; font-style:bold">ACCOUNTING OFFICE REVENUE ASSURANCE (1)</div>'},
    'SE', 'District'],
    [{'v':'AAC', 'f':'<div style="color:black; font-style:bold">ACCOUNTING CLERK (1)</div>'},
    'AOR', 'District'],
    [{'v':'AOC', 'f':'<div style="color:black; font-style:bold">ACCOUNTING OFFICE COSTING (1)</div>'},
    'SE', 'District'],
    [{'v':'AC', 'f':'<div style="color:black; font-style:bold">ACCOUNTING CLERK (1)</div>'},
    'AOC', 'District'],
    [{'v':'AOC', 'f':'<div style="color:black; font-style:bold">ACCOUNTING OFFICE CASH (1)</div>'},
    'SE', 'District'],
    [{'v':'CS', 'f':'<div style="color:black; font-style:bold">COMMERCIAL SUPERVISOR (1)</div>'},
    'SE', 'District'],

   
 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});

    document.getElementById('download_button').addEventListener('click', function() {
      var chartContainer = document.getElementById('chart_div');
      var chartImage = chartContainer.getElementsByTagName('table')[0].outerHTML;

      // Create a temporary canvas element to draw the chart as an image
      var canvas = document.createElement('canvas');
      canvas.width = chartContainer.offsetWidth;
      canvas.height = chartContainer.offsetHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawSvg(chartImage, 0, 0, canvas.width, canvas.height);

      // Convert canvas to PDF using html2pdf library
      var canvasDataUrl = canvas.toDataURL('image/png');
      var pdfOptions = {
          filename: 'Sales_Chart.pdf',
          image: { type: 'png', data: canvasDataUrl },
          html2canvas: { scale: 2 }
      };
      html2pdf().set(pdfOptions).from(chartContainer).save();

  })

  }
</script>
{% endblock %}
{%block content%}

<div>
  <a href="#" id="download_button" style="text-color:blue"  class="download-button">Download Chart</a>
  <div id="chart_div" class="py-10 px-5"></div>
</div>

{%endblock%}
