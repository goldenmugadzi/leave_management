{% extends 'admin_layout.html' %}
{% load static%}

{% block styles %}
<link
  rel="stylesheet"
  href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"
/>
<style>
  .dataTables_wrapper .dataTables_length select {
    width: 4rem;
  }
</style>
{% endblock styles %}
{% block content %}
<div class="content-wrapper">
  <div
    class="bg-gulf-blue-100 shadow shadow-gulf-blue-500 text-gulf-blue-900 rounded px-2 py-2"
  >
    
    <table id="Document" class="display" style="width: 100%">
      <thead>
        <tr>
          <th>category</th>
          <th>name</th>
          <th>region</th>
          <th>section</th>
          <th>file</th>
          <th>created by</th>
          <th>created at</th>
          <th>action</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
      <tfoot>
        <tr>
          <th>category</th>
          <th>name</th>
          <th>region</th>
          <th>section</th>
          <th>file</th>
          <th>created by</th>
          <th>created at</th>
          <th>action</th>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

{%endblock%} {% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
 var objs = JSON.parse("{{context|escapejs}}");
 console.log("objs: ", objs)

$(document).ready(function () {
  $("#Document").DataTable({
    data: objs,
    columns: [
      {
        data: "category",
      },
      {
        data: "name",
      },
      {
        data: "region",
      },
      {
        data: "section",
      },
      {
        data: "file",
      },
      {
        data: "created by",
      }, 
      {
        data: "created at",
      },  
      {
          data: null,
          width: "15%",
          render: function (data, type, row, meta) {
            let archiveButton = ""
            if(row.archive === true){
              archiveButton = `<a type="button" class="btn btn-warning" href='/competence/unarchive_file/${row.id}' >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
                </svg>                               
              </a>`
            } else {
              archiveButton = `<a type="button" class="btn btn-danger" href='/competence/archive_file/${row.id}' >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-6 h-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z"
                  />
                </svg>
              </a>`
            }
            return `
              <div>
                <a type="button" class="btn btn-info" href='/competence/edit_document/${row.id}' >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                  </svg>                
                </a>
                <a type="button" class="btn btn-secondary" href='/competence/download?file_id=${row.id}' >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 13.5l3 3m0 0l3-3m-3 3v-6m1.06-4.19l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                  </svg>                               
                </a>
                ${archiveButton}
              </div>
              `;
          },
        },
    ]
  });
});
</script>
{% endblock scripts %}
