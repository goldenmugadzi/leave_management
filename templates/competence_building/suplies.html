{% extends 'admin_layout.html' %}
{%load static%}
{% block styles %}
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
  
  google.charts.load('current', {packages:["orgchart"]});
  google.charts.setOnLoadCallback(drawChart);

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    // For each orgchart box, provide the name, manager, and tooltip to show.
    data.addRows([


    [{'v':'SO', 'f':'<div style="color:black; font-style:bold">SUPPLIES OFFICER</div>'},
    '', 'Supplies'],
    [{'v':'STO', 'f':'<div style="color:black; font-style:bold">STORES OFFICER (1)</div>'},
    'SO', 'STORES'],
    [{'v':'STK', 'f':'<div style="color:black; font-style:bold">STORES KEEPER (1)</div>'},
    'STO', 'STORES'],
    [{'v':'HDD', 'f':'<div style="color:black; font-style:bold">HEAVY DUTY DRIVER (1)</div>'},
    'STO', 'STORES'],
    [{'v':'FUA', 'f':'<div style="color:black; font-style:bold">FUEL ATTANDENT (2)</div>'},
    'STK', 'STORES'],
    [{'v':'STA', 'f':'<div style="color:black; font-style:bold">STORES ASSISTANT (3)</div>'},
    'STK', 'STORES'],
    
 ]);

    // Create the chart.
    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    // Draw the chart, setting the allowHtml option to true for the tooltips.
    chart.draw(data, {'allowHtml':true});

}
</script>
{% endblock %}
{%block content%}

<div>
  
  <div style="text-color:blue font-size:14pt"><strong>CHART D4.2a HARARE REGION - FINANCE-STORES 2016</strong></div>
  <div id="chart_div" class="py-10 px-5"></div>
</div>

{%endblock%}
