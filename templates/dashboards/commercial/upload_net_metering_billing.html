<!--users/templates/users/add_user.html-->

{% extends 'admin_layout.html' %} 
{% block content %}

<div class="content-wrapper">
  
  <div class="bg-gulf-blue-100 shadow shadow-gulf-blue-200 text-gray-900 rounded px-2 py-2">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="space-y-12 px-5 py-5">

        <div class="mt-10 border-b border-gray-900/10 pb-12">
          <h2 class="text-base font-semibold leading-7 text-gray-900">
            Upload Net Metering Billing
          </h2>
          <p class="mt-1 text-sm leading-6 text-gray-600">
            Upload a CSV file with the following columns: commissioned_points, billed_points, region.
          </p>

          <div class="mt-10 grid grid-cols-3 gap-4">
            <div class="col-span-2">
                <label
                  for="uploaded_file"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Upload CSV File</label
                >
                <div class="mt-2">
                  <input
                    type="file"
                    name="uploaded_file"
                    id="uploaded_file"
                    autocomplete="family-name"
                    class="block w-full rounded-md border-0 py-1.5 px-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                  />
                </div>
              </div>

          </div>
        </div>
      </div>

      <div class="flex mt-10 px-3 py-3">
        <div style="width: 50%;" class="flex justify-center">
            <a href="{% url 'dsm_dashboard' %}" style="width: 100%;" class="text-sm text-center font-semibold leading-6 text-gray-900">
              CANCEL
            </a>
        </div>
        <div style="width: 50%;">
          <div class="text-center">
            <button
              type="submit"
              class="bg-gulf-blue-500 text-white px-4 py-2 rounded-md"
            >
              UPLOAD FILE
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
