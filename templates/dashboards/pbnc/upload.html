{% extends 'admin_layout.html' %} {% comment %} {% extends
'layouts/user-base.html' %} {% endcomment %} {% load static %} {% block content %}
<div class="flex-column align-items-center ">
  <div class="flex-auto p-6">
    <form role="form" action="/dashboards/pbnc/upload" method="POST" enctype="multipart/form-data">
        {%csrf_token%}
      <label class="mb-2 ml-1 font-bold text-xs text-slate-700">Upload CSV</label>
      <div class="mb-4">
        <input
          type="file"
          name="uploaded_csv"
          class="focus:shadow-soft-primary-outline text-sm leading-5.6 ease-soft block w-full appearance-none rounded-lg border border-solid border-gray-300 bg-white bg-clip-padding px-3 py-2 font-normal text-gray-700 transition-all focus:border-fuchsia-300 focus:outline-none focus:transition-shadow"
          placeholder="PBNC"
          aria-label="PBNC"
        />
      </div>
      <div class="text-center">
        <button
          type="submit"
        >
          Sign in
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
