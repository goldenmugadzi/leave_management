{% extends "admin_layout.html" %}

{% block content %}
<div class="quick-fault-report p-6 max-w-2xl mx-auto">
  <div class="header mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Quick Fault Report</h1>
    <p class="text-gray-600">Report a new fault quickly and efficiently</p>
  </div>

  <form method="post" class="bg-white rounded-lg shadow-md p-6">
    {% csrf_token %}
    
    <div class="form-grid space-y-6">
      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          📝 Fault Description *
        </label>
        <textarea name="description" rows="3" required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Describe the fault clearly..."></textarea>
      </div>

      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          📍 Location/Depot *
        </label>
        <select name="depot" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <option value="">Select Depot...</option>
          {% for depot in depots %}
          <option value="{{ depot.id }}">{{ depot.depot }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          🔧 Device Serial Number
        </label>
        <select name="device"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <option value="">Select Device (if known)...</option>
          {% for device in devices %}
          <option value="{{ device.id }}">{{ device.serial_number }} - {{ device.device_type }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          ⚡ Priority Level
        </label>
        <select name="priority"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <option value="LOW">🟢 Low Priority</option>
          <option value="MEDIUM" selected>🟡 Medium Priority</option>
          <option value="HIGH">🔴 High Priority</option>
          <option value="CRITICAL">🚨 Critical</option>
        </select>
      </div>

      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          👥 Assign to Team
        </label>
        <select name="team"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <option value="">Auto-assign based on location</option>
          {% for team in teams %}
          <option value="{{ team.id }}">{{ team.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-actions flex space-x-4 mt-8">
      <button type="submit" 
              class="flex-1 py-3 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700 transition">
        🚨 Report Fault
      </button>
      
      <a href="{% url 'fault_locator_dashboard' %}" 
         class="flex-1 py-3 bg-gray-500 text-white rounded-lg font-semibold text-center hover:bg-gray-600 transition">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
