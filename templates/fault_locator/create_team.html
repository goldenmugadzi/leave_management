{% extends 'admin_layout.html' %}
{% block content %}
<div class="content-wrapper">
  <div class="bg-gulf-blue-100 shadow-lg rounded-lg p-6 max-w-md mx-auto">
    <h3 class="text-center font-bold mb-4">Create Fault Locator Team</h3>
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label for="id_name" class="block text-sm font-medium text-gray-700">Team Name</label>
        {{ form.name }}
      </div>
      <div class="flex justify-center">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
          Create Team
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
