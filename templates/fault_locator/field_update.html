{% extends "admin_layout.html" %}

{% block content %}
<div class="field-update-container p-4 max-w-lg mx-auto">
  <div class="fault-summary bg-white rounded-lg shadow-md p-6 mb-6">
    <h2 class="text-xl font-bold text-gray-800 mb-2">{{ fault.description }}</h2>
    <p class="text-gray-600">📍 {{ fault.depot.depot }} | 🔧 {{ device.serial_number }}</p>
    <div class="mt-3 text-sm text-gray-500">
      Assigned to: {{ fault.assignment.team.name }}
    </div>
  </div>
  
  <div class="action-buttons space-y-3">
    <form method="post" class="space-y-3">
      {% csrf_token %}
      <button type="submit" name="action" value="located" 
              class="w-full py-4 bg-green-600 text-white rounded-lg text-lg font-semibold hover:bg-green-700 transition flex items-center justify-center">
        ✅ Fault Located
      </button>
      
      <button type="submit" name="action" value="progress" 
              class="w-full py-4 bg-blue-600 text-white rounded-lg text-lg font-semibold hover:bg-blue-700 transition flex items-center justify-center">
        📝 Add Progress Note
      </button>
      
      <button type="submit" name="action" value="need_help" 
              class="w-full py-4 bg-yellow-600 text-white rounded-lg text-lg font-semibold hover:bg-yellow-700 transition flex items-center justify-center">
        🆘 Need Help
      </button>
      
      <a href="{% url 'fault_locator_dashboard' %}" 
         class="w-full py-3 bg-gray-500 text-white rounded-lg text-center block hover:bg-gray-600 transition">
        ← Back to Dashboard
      </a>
    </form>
  </div>
</div>

<style>
@media (max-width: 640px) {
  .field-update-container {
    padding: 1rem;
  }
  
  .action-buttons button {
    font-size: 1.1rem;
    padding: 1rem;
  }
}
</style>
{% endblock %}
