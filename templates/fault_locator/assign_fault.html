{% extends "admin_layout.html" %}
{% load static %}

{% block content %}
<div class="content-wrapper">
  <form method="post" class="max-w-2xl mx-auto bg-gray-200 shadow shadow-nepal-300 text-gray-700 rounded px-2 py-2 mt-8">
    {% csrf_token %}
    <div class="space-y-8 px-5 py-5">
      <div class="border-b border-gray-900/10 pb-8">
        <h2 class="text-base font-semibold leading-7 text-gray-900">
          Assign Fault
        </h2>
        <p class="mt-1 text-sm leading-6 text-gray-600">
          Select the fault, team, and device to assign.
        </p>
        <div class="mt-8 grid grid-cols-1 gap-6">
          <div>
            <label for="id_fault" class="block text-sm font-medium leading-6 text-gray-900">Fault</label>
            <div class="mt-2">
              {{ form.fault }}
            </div>
          </div>
          <div>
            <label for="id_team" class="block text-sm font-medium leading-6 text-gray-900">Team</label>
            <div class="mt-2">
              {{ form.team }}
            </div>
          </div>
          <div>
            <label for="id_device" class="block text-sm font-medium leading-6 text-gray-900">Device</label>
            <div class="mt-2">
              {{ form.device }}
            </div>
          </div>
        </div>
      </div>
      <div class="flex mt-10 px-3 py-3">
        <div style="width: 50%;">
          <a href="{% url 'fault_locator_home' %}" class="text-sm font-semibold leading-6 text-gray-900 block text-center bg-gray-300 rounded py-2">Cancel</a>
        </div>
        <div style="width: 50%;">
          <button
            type="submit"
            class="rounded-md bg-blue-925 hover:bg-blue-550 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 w-full"
          >
            Assign
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
{% endblock %}
