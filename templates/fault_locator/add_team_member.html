{% extends 'admin_layout.html' %}
{% block content %}
<div class="content-wrapper">
  <div class="bg-gulf-blue-100 shadow-lg rounded-lg p-6 max-w-md mx-auto">
    <h3 class="text-center font-bold mb-4">Add Members to {{ team.name }}</h3>
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        {{ form.member.label_tag }}
        {{ form.member }}
      </div>
      <div class="flex justify-center">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
          Add Member
        </button>
      </div>
    </form>
    <div class="mt-6">
      <h4 class="font-semibold mb-2">Current Members:</h4>
      <ul>
        {% for member in members %}
          <li>{{ member }}</li>
        {% empty %}
          <li>No members yet.</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
