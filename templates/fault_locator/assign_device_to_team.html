{% extends "admin_layout.html" %}
{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
  <div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-lg">
    <h2 class="font-bold text-2xl mb-6 text-gulf-blue-900 flex items-center gap-2">
      <svg class="w-6 h-6 text-gulf-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
  Assign Gear to Team
    </h2>
    <form method="post" class="space-y-6">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}
            <p class="text-xs text-gray-400 mt-1">{{ field.help_text }}</p>
          {% endif %}
          {% for error in field.errors %}
            <p class="text-xs text-red-500 mt-1">{{ error }}</p>
          {% endfor %}
        </div>
      {% endfor %}
      <div class="flex gap-4 mt-6">
        <button type="submit" class="px-6 py-2 bg-gulf-blue-600 text-white rounded hover:bg-gulf-blue-700 focus:ring-2 focus:ring-gulf-blue-400 transition">Assign</button>
        <a href="{% url 'fault_locator:team_list' %}" class="px-6 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
