{% extends 'admin_layout.html' %} {% load static %} {% block content %}
<div style="display: flex; justify-content: flex-end" class="">
  <div style="display: flex; justify-content: center">
    <a
      href="/ims/ims_files"
      class="hover:bg-blue-200 outline-none focus:outline-none px-3 py-1 rounded flex items-center"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-6 h-6 text-gulf-blue-700"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 0 1-1.125-1.125M3.375 19.5h7.5c.621 0 1.125-.504 1.125-1.125m-9.75 0V5.625m0 12.75v-1.5c0-.621.504-1.125 1.125-1.125m18.375 2.625V5.625m0 12.75c0 .621-.504 1.125-1.125 1.125m1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125m0 3.75h-7.5A1.125 1.125 0 0 1 12 18.375m9.75-12.75c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125m19.5 0v1.5c0 .621-.504 1.125-1.125 1.125M2.25 5.625v1.5c0 .621.504 1.125 1.125 1.125m0 0h17.25m-17.25 0h7.5c.621 0 1.125.504 1.125 1.125M3.375 8.25c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125m17.25-3.75h-7.5c-.621 0-1.125.504-1.125 1.125m8.625-1.125c.621 0 1.125.504 1.125 1.125v1.5c0 .621-.504 1.125-1.125 1.125m-17.25 0h7.5m-7.5 0c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125M12 10.875v-1.5m0 1.5c0 .621-.504 1.125-1.125 1.125M12 10.875c0 .621.504 1.125 1.125 1.125m-2.25 0c.621 0 1.125.504 1.125 1.125M13.125 12h7.5m-7.5 0c-.621 0-1.125.504-1.125 1.125M20.625 12c.621 0 1.125.504 1.125 1.125v1.5c0 .621-.504 1.125-1.125 1.125m-17.25 0h7.5M12 14.625v-1.5m0 1.5c0 .621-.504 1.125-1.125 1.125M12 14.625c0 .621.504 1.125 1.125 1.125m-2.25 0c.621 0 1.125.504 1.125 1.125m0 1.5v-1.5m0 0c0-.621.504-1.125 1.125-1.125m0 0h7.5"
        />
      </svg>
      <span class="px-2 font-semibold flex-1 text-gulf-blue-700">VIEW All</span>
    </a>
  </div>
  <div style="display: flex; justify-content: center">
    <a
      href="/ims/create_bulk_files"
      class="hover:bg-blue-200 outline-none focus:outline-none px-3 py-1 rounded flex items-center"
    >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gulf-blue-700">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 7.5h-.75A2.25 2.25 0 0 0 4.5 9.75v7.5a2.25 2.25 0 0 0 2.25 2.25h7.5a2.25 2.25 0 0 0 2.25-2.25v-7.5a2.25 2.25 0 0 0-2.25-2.25h-.75m0-3-3-3m0 0-3 3m3-3v11.25m6-2.25h.75a2.25 2.25 0 0 1 2.25 2.25v7.5a2.25 2.25 0 0 1-2.25 2.25h-7.5a2.25 2.25 0 0 1-2.25-2.25v-.75" />
      </svg>      
      <span class="px-2 font-semibold flex-1 text-gulf-blue-700">UPLOAD BULK FILES</span>
    </a>
  </div>
  <div style="display: flex; justify-content: center">
    <a
      href="/ims/create_file"
      class="hover:bg-blue-200 outline-none focus:outline-none px-3 py-1 rounded flex items-center"
    >
    <svg class="w-6 h-6 text-gulf-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25H7.5a2.25 2.25 0 0 0-2.25 2.25v9a2.25 2.25 0 0 0 2.25 2.25h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25H15m0-3-3-3m0 0-3 3m3-3V15" />
      </svg>      
      <span class="px-2 font-semibold flex-1 text-gulf-blue-700">UPLOAD FILE</span>
    </a>
  </div>
  <div style="display: flex; justify-content: center">
    <a
      href="/ims/manage_folders"
      class="hover:bg-gray-200 outline-none focus:outline-none px-3 py-1 rounded flex items-center"
    >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gulf-blue-700">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
      </svg>
      
      <span class="px-2 font-semibold block text-gulf-blue-700">MANAGE FOLDERS</span>
    </a>
  </div>
  <div style="display: flex; justify-content: center">
    <a
      href="/ims/view_archive"
      class="hover:bg-gray-200 outline-none focus:outline-none px-3 py-1 rounded flex items-center"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z"
        />
      </svg>
      <span class="px-2 font-semibold flex-1 text-gray-700">VIEW ARCHIVES</span>
    </a>
  </div>
</div>
<div class="mt-5"></div>
<div class="content-wrapper flex flex-wrap p-2">
  <div class="grid grid-cols-3 gap-4">
    {% for folder in folders %}
        <div
        class="w-auto bg-gray-200 shadow shadow-nepal-300 text-gray-700 rounded px-2 py-2"
        >
        <div class="sm:flex lg:items-center lg:justify-between">
            <div class="min-w-0 flex-1">
            <div class="">
                <div class="mx-auto">
                <div class="group relative">
                    <div
                    style="background-color: #a16207"
                    class="aspect-h-1 aspect-w-1 w-full overflow-hidden rounded-md bg-gray-200 lg:aspect-none group-hover:opacity-75 lg:h-40"
                    >
                    <a href="{{folder.url}}">
                        <img
                        src={{folder.cover}}
                        alt=""
                        class=""
                        />
                    </a>
                    </div>
                    <div class="mt-4 flex justify-center">
                    <div class="w-full">
                        <div
                        class="dropdown-group inline-block w-full text-blue-50"
                        >
                        <a href="{{folder.url}}">
                            <button
                            class="w-full bg-gulf-blue-600 hover:bg-blue-800 outline-none focus:outline-none border px-3 py-1 rounded flex items-center"
                            >
                            <span class="pr-1 font-semibold flex-1 text-blue-50"
                                >{{folder.name}}</span
                            >
                            <span class="text-blue-50"> </span>
                            </button>
                        </a>
                        </div>
                    </div>
                    </div>
                </div>
                </div>
            </div>
            </div>
        </div>
        </div>
    {% endfor %}
  </div>
</div>

{% endblock %}
