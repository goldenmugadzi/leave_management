<!--users/templates/quotations/index.html-->
{% extends 'admin_layout.html' %} {% block styles %}
<link
  rel="stylesheet"
  href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"
/>
<style>
  .dataTables_wrapper .dataTables_length select {
    width: 4rem;
  }
</style>
{% endblock styles %} {% block content %}
<div class="content-wrapper">
  <div
    class="bg-gulf-blue-100 shadow shadow-gulf-blue-200 text-gray-900 rounded px-2 py-2"
  >
    <h2 class="text-base font-semibold leading-7 text-gray-900">
      Knowledge Centre
    </h2>
    <div class="my-5">
      <div class="flex justify-between items-center">
        <div class="text-sm leading-6 text-gray-600">Manage Folders</div>
        <div class="flex text-sm leading-6 text-gray-600">
          <a
            href="create_root_folder"
            class="hover:bg-blue-200 outline-none focus:outline-none px-3 py-1 rounded flex items-center"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gulf-blue-700">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
            </svg>
            <span class="px-2 font-semibold flex-1 text-gulf-blue-700"
              >CREATE ROOT FOLDER</span
            >
          </a>
        </div>
      </div>
    </div>
    <table id="files_index" class="display" style="width: 100%">
      <thead>
        <tr>
          <th>ID</th>
          <th>Application</th>
          <th>Folder</th>
          <th>Parent</th>
          <th>Date</th>
          <th>ACTION</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <th>ID</th>
          <th>Application</th>
          <th>Folder</th>
          <th>Parent</th>
          <th>Date</th>
          <th>ACTION</th>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
  var folders = JSON.parse("{{folders|escapejs}}");
  console.log("objs: ", folders)
  $(document).ready(function () {
    $("#files_index").DataTable({
      data: folders,
      columns: [
        {
            data: null,
            render: function (data, type, row, meta) {
                return meta.row + 1; // meta.row is the row index starting from 0
            },
            width: "5%",
        },
        {
          data: "application",
          width: "20%",
        },
        {
          data: "name",
          width: "20%",
        },
        {
          data: "parent",
          width: "20%",
        },
        {
          data: "created_at",
          width: "10%",
        },
        {
          data: null,
          width: "15%",
          render: function (data, type, row, meta) {
            return `
              <div>
                <a type="button" class="btn btn-info" href='/knowledge_center/create_subfolder/${row.id}' >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
                    </svg>               
                </a>
                <a type="button" class="btn btn-info" href='/knowledge_center/edit_folder/${row.id}' >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                  </svg>                
                </a>
                <a type="button" class="btn btn-secondary" href='/knowledge_center/delete_folder/${row.id}' >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                    </svg>          
                </a>
              </div>
              `;
          },
        },
      ],
    });
  });
</script>
{% endblock scripts %}
