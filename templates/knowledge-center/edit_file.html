<!--users/templates/users/add_user.html-->

{% extends 'admin_layout.html' %} {% block content %}

<div class="content-wrapper">
  
  <div class="bg-gulf-blue-100 shadow shadow-gulf-blue-200 text-gray-900 rounded px-2 py-2">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="space-y-12 px-5 py-5">

        <div class="mt-10 border-b border-gulf-blue-900/10 pb-12">
          <h2 class="text-base font-semibold leading-7 text-gray-900">
            Edit File Information
          </h2>
          <p class="mt-1 text-sm leading-6 text-gray-600">
            Fill all required fields.
          </p>

          <div class="mt-10 grid grid-cols-3 gap-4">
            <input
            type="hidden"
            name="id"
            value="{{record.id}}"
          />
            <div>
              <label
                for="filename"
                class="block text-sm font-medium leading-6 text-gray-900"
                >File Name</label
              >
              <div class="mt-2">
                <input
                  type="text"
                  name="filename"
                  value="{{record.filename}}"
                  id="filename"
                  autocomplete="given-name"
                  class="block w-full rounded-md border-0 py-1.5 text-gray-900  px-2 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                />
              </div>
            </div>

            <div>
                <label
                  for="uploaded_file"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Upload File</label
                >
                <div class="mt-2">
                  <input
                  accept="application/pdf"
                    type="file"
                    name="uploaded_file"
                    id="uploaded_file"
                    autocomplete="family-name"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm px-2 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                  />
                </div>
              </div>

            <div>
              <label
                for="section"
                class="block text-sm font-medium leading-6 text-gray-900"
                >File Type</label
              >
              <div class="mt-2">
                <select
                    required
                  id="category_id"
                  name="category_id"
                  autocomplete="category_id"
                  class="block w-full rounded-md border-0 py-1.5 px-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                >
                  {% if record.file_type %}
                    <option value="{{ record.id }}">{{ record.file_type }}</option>
                  {%endif%}
                  <option value="">Select File Type</option>
                  {% for filetype in filetypes %}
                    <option value="{{filetype.id}}">{{filetype.name}}</option>
                    {% endfor %}
                  
                </select>
                
              </div>
            </div>

            <div>
              <label
                for="subtype1"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Sub type 1</label
              >
              <div class="mt-2">
                <select
                id="subtype1"
                name="subtype1"
                autocomplete="category_id"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900  px-2 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
              >
              {% if record.sub_category_1 %}
                <option value="{{ record.id }}">{{ record.sub_category_1 }}</option>
              {%endif%}
              </select>
              </div>
            </div>
            <div>
              <label
                for="subtype2"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Sub type 2</label
              >
              <div class="mt-2">
                <select
                id="subtype2"
                name="subtype2"
                autocomplete="subtype1"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900  px-2 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
              >
              {% if record.sub_category_2 %}
                <option value="{{ record.id }}">{{ record.sub_category_2 }}</option>
              {%endif%}
              </select>
              </div>
            </div>
            <div>
                <label
                  for="section"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Section</label
                >
                <div class="mt-2">
                  <select
                    id="section"
                    name="section"
                    autocomplete="section"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900  px-2 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                  >
                    {% if record.section_id %}
                    <option value="{{record.section_id.id}}">{{record.section_id.section}}</option>
                    {% endif %}
                    <option value="">Select Section</option>
                    {% for section in sections %}
                    <option value="{{section.id}}">{{section.section}}</option>
                    {% endfor %}
                  </select>
                </div>
              </div>
  
              <div>
                <label
                  for="region"
                  class="block text-sm font-medium leading-6 text-gray-900"
                  >Region</label
                >
                <div class="mt-2">
                  <select
                  required
                    id="region"
                    name="region"
                    autocomplete="region"
                    class="block w-full rounded-md border-0 px-2 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                  >
                  {% if record.region_id %}
                  <option value="{{record.region_id.id}}">{{record.region_id.region}}</option>
                  {% endif %}
                    <option value="">Select Region</option>
                    {% for region in regions %}
                    <option value="{{region.id}}">{{region.region}}</option>
                    {% endfor %}
                  </select>
                </div>
              </div>

          </div>
        </div>
      </div>

      <div class="flex mt-10 px-3 py-3">
        <div style="width: 50%;" class="flex justify-center">
          <a href="/knowledge_center/knowledge_center_files" style="width: 100%;" class="text-sm text-center font-semibold leading-6 text-gray-900">
            CANCEL
          </a>
        </div>
        <div style="width: 50%;">
          <button
          style="width: 100%;"
            type="submit"
            class="rounded-md bg-blue-925 hover:bg-blue-550 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
          >
            EDIT FILE
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script>
  $("#category_id").change(function() {
    var selectedValue = $(this).val();
    $.ajax({
      url: '/knowledge_center/get-files/' + selectedValue,
      type: 'GET',
      success: function(data) {
          var selectElement = document.getElementById("subtype1");
          // Clear existing options
          selectElement.options.length = 0;

          // Add new options based on data
          console.log(data.subtypes);
          let selectOpt = new Option("Select Subtype", "");
          selectElement.add(selectOpt);
          for (var option of data.options) {
              var opt = new Option(option.name, option.id);
              selectElement.add(opt);
          }
          if(data.options.length > 0){
            document.getElementById("subtype1_container").style.display = "block";
            document.getElementById("subtype1").required = true;
          }
      }
    });
  });
</script>
<script>
  $("#subtype1").change(function() {
    var selectedValue = $(this).val();
    var fileType = document.getElementById("category_id").value;
    $.ajax({
      url: '/knowledge_center/get-cat2/'+ fileType + '/' + selectedValue,
      type: 'GET',
      success: function(data) {
          var secondCategory = document.getElementById("subtype2");
          // Clear existing options
          secondCategory.options.length = 0;

          // Add new options based on data
          console.log(data.subtypes);
          let selectOpt = new Option("Select Subtype", "");
          secondCategory.add(selectOpt);
          for (var option of data.options_list) {
              var opt = new Option(option.name, option.id);
              secondCategory.add(opt);
          }
          if(data.options_list.length > 0){
            document.getElementById("subtype2_container").style.display = "block";
            document.getElementById("subtype2").required = true;
          }
      }
    });
  });

</script>
{% endblock scripts %}
