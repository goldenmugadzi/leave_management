{% extends 'admin_layout.html' %}
{% block styles %}
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
<style>
    .main-heading {
        font-size: 2rem;
        font-weight: bold;
        color: #17191e;
        margin-bottom: 2rem;
        text-align: center;
        width: 100%;
        letter-spacing: 1px;
    }
    .tab-button svg {
        width: 1.3rem;
        height: 1.3rem;
        margin-bottom: 0;
        opacity: 0.85;
    }
    .button-grid {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
    }
    .tab-button {
        display: flex;
        align-items: center;
        padding: 0.5rem 1.5rem;
        border-radius: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(30,41,59,0.08);
        text-decoration: none;
        border: none;
        min-height: 48px;
        background: #fff;
        gap: 0.5rem;
        min-width: 170px;
        transition: transform 0.15s, box-shadow 0.15s;
    }
    .tab-button.bg-blue-600 { background: linear-gradient(90deg, #2563eb 80%, #3b82f6 100%); color: #fff; }
    .tab-button.bg-indigo-600 { background: linear-gradient(90deg, #4f46e5 80%, #6366f1 100%); color: #fff; }
    .tab-button.bg-yellow-400 { background: linear-gradient(90deg, #f59e42 80%, #fde68a 100%); color: #17191e; }
    .tab-button.bg-green-500 { background: linear-gradient(90deg, #16a34a 80%, #22c55e 100%); color: #fff; }
    .tab-button.bg-gray-400 { background: linear-gradient(90deg, #6b7280 80%, #9ca3af 100%); color: #fff; }
    .tab-button.bg-red-400 { background: linear-gradient(90deg, #dc2626 80%, #ef4444 100%); color: #fff; }
    .tab-button:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 4px 16px rgba(30,41,59,0.16);
        text-decoration: none;
    }
    /* Table Styling */
    .dataTables_wrapper .dataTables_length select { width: 4rem; }
    .dataTables_wrapper .dataTables_filter input {
        border-radius: 0.5rem;
        border: 1px solid #d1d5db;
        padding: 0.5rem 1rem;
        margin-left: 0.5rem;
        font-size: 1rem;
    }
    table.display {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 2px 8px rgba(30,41,59,0.08);
        overflow: hidden;
    }
    table.display thead th {
        background: #2563eb;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        border-bottom: 2px solid #3b82f6;
        padding: 1rem 0.75rem;
        letter-spacing: 0.5px;
    }
    table.display tbody td {
        padding: 0.75rem 0.5rem;
        font-size: 1rem;
        color: #17191e;
        border-bottom: 1px solid #e5e7eb;
        vertical-align: middle;
    }
    table.display tbody tr:nth-child(even) {
        background: #f3f4f6;
    }
    table.display tbody tr:hover {
        background: #e0e7ff;
        transition: background 0.2s;
    }
    .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        border-radius: 9999px;
        padding: 0.5rem 1rem;
        font-weight: 500;
        font-size: 0.95rem;
        box-shadow: 0 2px 8px rgba(30,41,59,0.08);
        border: none;
        transition: background 0.2s;
        margin-right: 0.5rem;
        text-decoration: none;
    }
    .action-btn.bg-blue-600 { background: linear-gradient(90deg, #2563eb 80%, #3b82f6 100%); color: #fff; }
    .action-btn.bg-blue-600:hover { background: #1d4ed8; color: #fff; }
    .action-btn.bg-yellow-500 { background: linear-gradient(90deg, #f59e42 80%, #fde68a 100%); color: #17191e; }
    .action-btn.bg-yellow-500:hover { background: #fbbf24; color: #17191e; }
</style>
{% endblock %}

{% block content %}
<div class="content-wrapper">
  <div class="bg-gulf-blue-100 shadow shadow-gulf-blue-300 text-gulf-blue-900 rounded px-2 py-2">
    <div class="main-heading">Leave Types And Balances </div>
    
    <div class="overflow-x-auto">
      <table id="leaveTypesTable" class="display" style="width:100%">
        <thead>
          <tr>
            <th>ID</th>
            <th>Sick Leave</th>
            <th>Maternity Leave</th>
            <th>Special Leave</th>
            <th>Unpaid Leave</th>
            <th>Vacation Leave</th>
            <th>Study Leave</th>
            <th>Occasional Leave</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
const is_requester = "{{ is_requester|yesno:'true,false' }}".toLowerCase() === "true";
console.log("Requester status:", is_requester);
$(document).ready(function () {
  $("#leaveTypesTable").DataTable({
    processing: true,
    serverSide: true,
    ajax: {
      url: "{% url 'leave_management:leave_types_datatable' %}",
      type: "GET"
    },
    columns: [
      { data: "id" },
      { data: "sick_leave" },
      { data: "maternity_leave" },
      { data: "special_leave" },
      { data: "unpaid_leave" },
      { data: "vacation_leave" },
      { data: "study_leave" },
      { data: "occasional_leave" },
      {
        data: "id",
        render: function(data, type, row) {
        if (!is_requester) {
          return `
            <a href="/accumulate_vacation/${data}/Permanent/" 
              class="action-btn bg-blue-600"
              title="Accumulate for Permanent">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
              </svg>
              Permanent
            </a>
            <a href="/accumulate_vacation/${data}/Contract/" 
              class="action-btn bg-yellow-500"
              title="Accumulate for Contract">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
              </svg>
              Contract
            </a>
          `;
        } else {
          return '';
        }
      }
    }

    ],
    order: [[0, 'desc']]
  });
});
</script>
{% endblock %}
