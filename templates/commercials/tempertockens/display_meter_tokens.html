  {% extends 'commercials/tempertockens/base.html' %}

{% block MeterTokens %}
<h2>Meter Tokens</h2>
<table>
  <thead>
    <tr>
      <th>Token Number</th>
      <th>Date Purchased</th>
      <th>Reason</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for token in tokens %}
    <tr>
      <td>{{ token.token_number }}</td>
      <td>{{ token.date_purchased }}</td>
      <td>{{ token.reason }}</td>
      <td>
        <a href="{% url 'update_meter_token' token.pk %}">Edit</a> |
        <a href="{% url 'delete_meter_token' token.pk %}">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
