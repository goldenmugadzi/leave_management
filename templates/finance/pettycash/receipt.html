<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form method="post" action="/pettycash/receipt_manual" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
        <label for="file-input">receipt</label>
        <input type="file" class="form-control" id="file-input" name="file-input" required>
    </div>
    <div class="form-group">
        <label for="pettycash">Pettycash</label>
        <input type="text" class="form-control" id="pettycash" name="pettycash" required>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>

</body>
</html>
