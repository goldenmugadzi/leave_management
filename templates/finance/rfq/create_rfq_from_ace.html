
{% extends 'admin_layout.html' %} {% block content %}
    <form enctype="multipart/form-data" method="post" action="/ace/create">
        <div class="content-wrapper">
            {% if messages %}


                <ul

                        class="messages">


                    {% for message in messages %}
                        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>


                    {% endfor %}


                </ul>

            {% endif %}


            <div class="bg-gray-200 shadow shadow-nepal-300 text-gray-700 rounded px-2 py-2">

                            <p class="mt-1 text-sm leading-6 text-gray-600">

                                        />

                                        />
                                    </div>
                                </div>


                                <div>
                                    <label
                                            for="amount"
                                            class="block text-sm font-medium leading-6 text-gray-900"
                                    >Amount($)</label
                                    >
                                    <div class="mt-2">
                                        <input
                                                id="amount"
                                                name="amount"
                                                type="number"
                                                autocomplete="amount"
                                                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label
                                            for="quantity"
                                            class="block text-sm font-medium leading-6 text-gray-900"
                                    >Quantity</label
                                    >
                                    <div class="mt-2">
                                        <input
                                                required
                                                id="quantity"
                                                name="quantity"
                                                type="number"
                                                autocomplete="quantity"
                                                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                                        />
                                    </div>
                                </div>

                            </div>

                            <div>
                                <label
                                        for="payment_mode"
                                        class="block text-sm font-medium leading-6 text-gray-900"
                                >Payment mode</label>
                                <div class="mt-2">
                                    <select name="payment_mode"  style="width:1200px" required="required">
                                        <i>
                                            <option value="">Select ACE Type</option>
                                        </i>
                                        <option value="internal">Cash</option>
                                        <option value="project">Bank>
                                    </select>
                                </div>
                            </div>

                    </div>
                </div>
    </form>
