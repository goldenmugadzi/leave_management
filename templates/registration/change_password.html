<!DOCTYPE html>
<html>
  {% load static %}
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Excellence</title>
    <link
      rel="shortcut icon"
      href="{% static 'assets/images/website-logo.png' %}"
    />
    <link href="{% static 'assets/css/tailwind.css' %}" rel="stylesheet" />
  </head>
  <body>
    <main>
      <div
        style="height: 100vh"
        class="flex justify-center items-center w-full bg-gray-100"
      >
        <div
          style="width: 50%"
          class="shadow bg-gray-200 h-auto shadow-gray-400 rounded-lg"
        >
          <div
            style="display: flex; flex-direction: column"
            class="flex px-4 py-4"
          >
            <div class="sm:mx-auto sm:w-full sm:max-w-sm">
              <img
                class="mx-auto h-28 w-auto"
                src="{% static 'assets/images/website-logo.png' %}"
                alt="Your Company"
              />
              <h2
                class="mt-2 last:text-center text-2xl font-bold leading-9 tracking-tight text-blue-950"
              >
                RESET PASSWORD
              </h2>
            </div>

            <div>
              <form 
                x-data="{
                    questions: [
                        { id: '', question: 'Select a question' },
                        { id: '1', question: 'What is your favorite color?' },
                        { id: '2', question: 'What is your favorite food?' },
                        { id: '3', question: 'What is your favorite movie?' },
                        { id: '4', question: 'What is your favorite song?' }
                    ],
                    selected: {
                        q1: '',
                        q2: '',
                        q3: '',
                        a1: '',
                        a2: '',
                        a3: ''
                    },
                    length: 3,
                    validateBeforeSubmit() {
                        if (this.selected.q1 === '' || this.selected.q2 === '' || this.selected.q3 === '') {
                            alert('Please select all security questions.');
                            return false; // Prevent form submission
                        }
                        console.log('Form submitted!')
                        this.$el.submit(); // Manually submit the form
                        return true; // Allow form submission
                    }
                }" x-on:submit.prevent="validateBeforeSubmit()"
                class="space-y-6" name="loginForm" action="/auth/change-password" method="post">
                {% csrf_token %}
                <div>
                  <label
                    for="new_password"
                    class="block text-sm font-medium leading-6 text-gray-900 mt-2"
                    >New Password</label
                  >
                  <div class="mt-2">
                    <input
                      id="new_password"
                      name="new_password"
                      type="text"
                      required
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-500 sm:text-sm sm:leading-6"
                    />
                  </div>
                </div>

                <div>
                  <label
                    for="password"
                    class="block text-sm font-medium leading-6 text-gray-900"
                    >Confirm Password</label
                  >
                  <div class="mt-2">
                    <input
                      id="password"
                      name="password"
                      type="password"
                      required
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-500 sm:text-sm sm:leading-6"
                    />
                  </div>
                </div>

                <div>
                  <template x-for="i in length">
                    <div class="flex justify-between">
                      <div style="width: 48%">
                        <label
                          x-bind:for="'security_question' + i"
                          class="block text-sm font-medium leading-6 text-gray-900"
                          >Security Question {{ i }}</label
                        >
                        <div class="mt-2">
                          <select
                            required
                            x-bind:id="'security_question' + i"
                            x-bind:name="'security_question' + i"
                            x-model="selected['q' + i]"
                            class="security_question block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-500 sm:text-sm sm:leading-6"
                          >
                            <template
                              x-for="question in questions"
                              :key="question.id"
                            >
                              <option
                                x-bind:value="question.id"
                                x-text="question.question"
                                x-bind:disabled="selected['q' + (i === 1 ? 2 : i === 2 ? 1 : 3)] === question.id"
                              ></option>
                            </template>
                          </select>
                        </div>
                      </div>
                      <div style="width: 48%">
                        <label
                          x-bind:for="'security_answer' + i"
                          class="block text-sm font-medium leading-6 text-gray-900"
                          >Security Answer {{ i }}</label
                        >
                        <div class="mt-2">
                          <input
                            required
                            x-bind:id="'security_answer' + i"
                            x-bind:name="'security_answer' + i"
                            type="text"
                            x-model="selected['a' + i]"
                            class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-500 sm:text-sm sm:leading-6"
                          />
                        </div>
                      </div>
                    </div>
                  </template>
                  <!-- Repeat for security_question2 and security_question3 with appropriate bindings -->
                </div>

                <div>
                  <button
                    type="submit"
                    class="flex w-full justify-center rounded-md bg-blue-925 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
                  >
                    Reset Password
                  </button>
                </div>
              </form>

              <p class="mt-10 text-center text-sm text-gray-500">
                <a
                  class="font-semibold leading-6 text-indigo-600 hover:text-indigo-500"
                  href="/accounts/login/"
                >Back to Login
                </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="//unpkg.com/alpinejs@3" defer></script>
  </body>
</html>
