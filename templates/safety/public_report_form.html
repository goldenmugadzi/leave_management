{% extends 'admin_layout.html' %}

{% block content %}
<div class="min-h-screen flex flex-col justify-center items-center bg-gray-50 p-4">
    <!-- Heading -->
    <h2 class="text-3xl font-bold mb-6 text-gray-800 text-center">
        Member of Public Accident Report
    </h2>

    <!-- Form Card -->
    <div class="w-full max-w-3xl bg-gulf-blue-100 shadow-md rounded-xl p-8 border border-gray-200">
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            {% for field in public_form %}
                <div>
                    <label for="{{ field.id_for_label }}" class="block mb-1 font-semibold text-gray-700">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.help_text %}
                        <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
                    {% endif %}
                    {% for error in field.errors %}
                        <p class="text-xs text-red-600 mt-1">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-all shadow-md">
                Submit Public Accident Report
            </button>
        </form>
    </div>
</div>
{% endblock %}
