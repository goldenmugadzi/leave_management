{% extends 'admin_layout.html' %}

{% block content %}
<div class="min-h-screen flex flex-col justify-center items-center bg-gulf-blue-100 p-4">
    <!-- Heading -->
    <h2 class="text-3xl font-bold mb-6 text-gray-800 text-center">
        Member of Public Accident Report
    </h2>

    <!-- Form Card -->
    <div class="w-full max-w-4xl bg-gulf-blue-100 shadow-md rounded-xl p-8 border border-gray-200">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- GRID 2 COLUMNS -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {% for field in public_form %}
                                            <div>
                                                <label for="{{ field.id_for_label }}" class="block mb-1 font-semibold text-gray-700">
                                                    {{ field.label }}
                                                    {% if field.name == 'attach_photographs' or field.name == 'attach_written_statements' %}
                                                        <span class="text-xs text-gray-500 font-normal">(Optional)</span>
                                                    {% endif %}
                                                </label>
                                                {{ field }}
                                                {% if field.help_text %}
                                                    <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
                                                {% endif %}
                                                {% for error in field.errors %}
                                                    <p class="text-xs text-red-600 mt-1">{{ error }}</p>
                                                {% endfor %}
                                            </div>
                                        {% endfor %}
            </div>

            <!-- BUTTONS -->
            <div class="flex flex-col sm:flex-row gap-4 mt-8">
        
                <button type="button" onclick="window.history.back()" class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-400 transition-all shadow-md">
                    Cancel
                </button>

                <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-all shadow-md">
                    Submit Report
                </button>
            </div>
                                </form>
                                <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
                                <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
                                <script>
                                    document.addEventListener('DOMContentLoaded', function() {
                                        // Apply select2 to all select elements with class 'select2'
                                        $("select.select2").select2({
                                            width: '100%',
                                            theme: 'classic',
                                            allowClear: true,
                                            placeholder: 'Select an option',
                                        });
                                    });
                                </script>
    </div>
</div>
{% endblock %}
