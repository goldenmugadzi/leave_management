{% extends 'admin_layout.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-8 mt-8">
  <div class="flex items-center gap-3 mb-6">
    <span class="text-green-600 text-3xl">&#127968;</span>
    <h2 class="text-2xl font-bold text-green-700">Edit Property Loss Incident</h2>
  </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="text-red-500 text-xs">{{ field.errors }}</div>
        {% endif %}
      </div>
    {% endfor %}
    <div class="flex gap-4 mt-6">
      <a href="{% url 'property_loss_table' %}" class="w-1/2 text-sm font-semibold border border-gray-300 text-gray-700 py-2 rounded-md text-center">CANCEL</a>
      <button type="submit" class="w-1/2 bg-green-600 text-white font-semibold py-2 rounded-md hover:bg-green-700">UPDATE</button>
    </div>
  </form>
</div>
{% endblock %}
