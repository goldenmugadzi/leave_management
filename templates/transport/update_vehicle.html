{% extends 'admin_layout.html' %}
{% load static %}
{% load custom_filters %}
{% block content %}

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
    $(document).ready(function() {
        $("#datepurchased").datepicker({ minDate: 0 });
    });
    </script>

    <div class="content-wrapper">
        <div class="bg-gulf-blue-100 shadow shadow-gulf-blue-300 text-gulf-blue-900 rounded px-2 py-2">
            <form method="post">
                {% csrf_token %}
                <div class="space-y-12 px-5 py-5">

                    <div class="mt-10 border-b border-gulf-blue-900/10 pb-12">
                        <h3 class="text-base font-semibold leading-7 text-gulf-blue-900">
                            User Information
                        </h3>
                        <p class="mt-1 text-sm leading-6 text-gulf-blue-900">
                            Fill all the required fields.
                        </p>

                      
                        <div class="mt-10 grid grid-cols-3 gap-4">

                            <div>
                                <label for="make" class="block text-sm font-medium leading-6 text-gray-900">Make</label>
                                <div class="mt-2">
                                    <input type="text" name="make" id="make" value="{{transportAssets.make}}"
                                           autocomplete="given-name"
                                           class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"/>
                                </div>
                            </div>

                            <div>
                                <label for="model" class="block text-sm font-medium leading-6 text-gray-900">Model</label>
                                <div class="mt-2">
                                    <input type="text" name="model" id="model" value="{{transportAssets.model}}"
                                           autocomplete="given-name"
                                           class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"/>
                                </div>
                            </div>

                            <div>
                                <label for="fleet_number" class="block text-sm font-medium leading-6 text-gray-900">Fleet Number</label>
                                <div class="mt-2">
                                    <input type="text" name="fleet_number" id="fleet_number" value="{{transportAssets.fleet_number}}"
                                           autocomplete="given-name"
                                           class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"/>
                                </div>
                            </div>

                        
                            <div>
                                <label for="reg_number" class="block text-sm font-medium leading-6 text-gray-900">Reg Number</label>
                                <div class="mt-2">
                                    <input type="text" name="reg_number" id="reg_number" value="{{transportAssets.reg_number}}"
                                           autocomplete="given-name"
                                           class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"/>
                                </div>
                            </div>

                           
                            <div>
                                <label for="regions" class="block text-sm font-medium leading-6 text-gray-900">Region</label>
                                <div class="mt-2">
                                    <select id="regions" name="regions" value="{{transportAssets.regions}}" autocomplete="regions"
                                            class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                        <option>Select region</option>
                                        {% for region in regions %}
                                            <option value="{{ region.id }}" {% if region.id == transportAssets.regions.id %}selected{% endif %}>
                                                {{ region.region }}
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label for="chass_number" class="block text-sm font-medium leading-6 text-gray-900">Chass Number</label>
                                <div class="mt-2">
                                    <input type="text" name="chass_number" id="chass_number" value="{{transportAssets.chass_number}}"
                                           autocomplete="given-name"
                                           class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"/>
                                </div>
                            </div>

                            <div>
                                <label for="engine_number" class="block text-sm font-medium leading-6 text-gray-900">Engine Number</label>
                                <div class="mt-2">
                                    <input type="text" name="engine_number" id="engine_number" value="{{transportAssets.engine_number}}"
                                           autocomplete="given-name"
                                           class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"/>
                                </div>
                            </div>

                            <div>
                                <label for="year" class="block text-sm font-medium leading-6 text-gray-900">Year</label>
                                <div class="mt-2">
                                    <input type="text" name="year" id="year" value="{{transportAssets.year}}"
                                           autocomplete="given-name"
                                           class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"/>
                                </div>
                            </div>

                            <div>
                                <label for="fuel_type" class="block text-sm font-medium leading-6 text-gray-900">Fuel Type</label>
                                <div class="mt-2">
                                    <select id="fuel_type" name="fuel_type" class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                        <option>Select type</option>
                                        <option value="PETROL"{% if transportAssets.fuel_type == "PETROL" %}selected{% endif %}>PETROL</option>
                                        <option value="DISEAL"{% if transportAssets.fuel_type == "DISEAL" %}selected{% endif %}>DISEAL</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label for="status" class="block text-sm font-medium leading-6 text-gray-900">Status</label>
                                <div class="mt-2">
                                    <select id="status" name="status" class="mt-2 block w-full rounded-md border border-gray-200 px-2 py-2 shadow-sm outline-none focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                        <option>Select status</option>
                                        <option value="Active"{% if transportAssets.status == "Active" %}selected{% endif %}>Active</option>
                                        <option value="Not Active"{% if transportAssets.status == "Not Active" %}selected{% endif %}>Not Active</option>
                                    </select>
                                </div>
                            </div>
                            
                            
                        </div>

                      
                        <div class="flex mt-10 px-3 py-3">
                            <div style="width: 50%;">
                                <button style="width: 100%;" class="text-sm font-semibold leading-6 text-gray-900">
                                    CANCEL
                                </button>
                            </div>
                            <div style="width: 50%;">
                                <button style="width: 100%;" type="submit"
                                        class="rounded-md bg-blue-925 hover:bg-blue-550 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                                    SAVE USER
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
