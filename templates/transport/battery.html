{% extends 'admin_layout.html' %}

{% block styles %}
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
<style>
  .dataTables_wrapper .dataTables_length select { width: 5rem; }
  .table-responsive { width: 100%; overflow-x: auto; }
  #batteryTable { min-width: 600px; }
</style>
{% endblock %}

{% block content %}
<div class="content-wrapper">
    <h2 class="text-2xl font-bold mb-4">Battery List</h2>
    <div class="bg-gulf-blue-100 shadow rounded px-2 py-2">
        <div class="table-responsive">
            <table id="batteryTable" class="min-w-full table-auto">
                <thead>
                    <tr class="bg-gray-100">
                        <th>Name</th>
                        <th>Number</th>
                        <th>Date Fitted</th>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
$(document).ready(function () {
    $('#batteryTable').DataTable({
        "processing": true,
        "serverSide": false,
        "columns": [
            {"data": "name"},
            {"data": "number"},
            {"data": "date_fitted"}
        ],
        "pageLength": 10,
        "lengthChange": false,
        "autoWidth": false
    });
});
</script>
{% endblock %}
