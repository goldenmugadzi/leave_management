{% extends 'admin_layout.html' %}

{% block styles %}
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
<style>
  .dataTables_wrapper .dataTables_length select {
    width: 5rem;
  }
  .tab-button {
    padding: 0.5rem 1rem;
    border: 2px solid transparent;
    border-radius: 0.375rem;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s;
  }
  .tab-button.active {
    background-color: #1d4ed8;
    color: white;
    border-color: #1d4ed8;
  }
  .tab-button:hover {
    background-color: #2563eb;
    color: white;
  }
  .table-responsive {
    width: 100%;
    overflow-x: auto;
  }
  #vehicleTable {
    min-width: 1200px;
  }
</style>
{% endblock styles %}
{% block content %}
<div class="container mx-auto mt-6">
  <h2 class="text-2xl font-bold mb-4 text-gray-800">Vehicle Records</h2>

  <div class="bg-gulf-blue-100 shadow shadow-gulf-blue-300 text-gulf-blue-900 rounded px-2 py-2">
    <div class="table-responsive">
    <table id="vehicleTable" class="min-w-full table-auto">
      <thead>
        <tr class="bg-gray-100">
          <th>Reg Number</th>
          <th>Fleet Number</th>
          <th>Make</th>
          <th>Model</th>
          <th>Year</th>
          <th>Fuel Drawn</th>
          <th>Oil Drawn</th>
          <th>Fuel Type</th>
        </tr>
      </thead>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
$(document).ready(function () {
    $('#vehicleTable').DataTable({
        "processing": true,
        "serverSide": true,
        "ajax": "{% url 'vehicle_datatable' %}",  
        "columns": [
            {"data": "reg_number"},
            {"data": "fleet_number"},
            {"data": "make"},
            {"data": "model"},
            {"data": "year"},
            {"data": "fuel_drawn"},
            {"data": "oil_drawn"},
            {"data": "fuel_type"}
        ],
        "pageLength": 10,
        "lengthChange": false,
        "autoWidth": false
    });
});
</script>
{% endblock %}
