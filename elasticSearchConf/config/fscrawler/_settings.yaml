name: "fscrawler"
fs:
  url: "/tmp/es"
  update_rate: "15m"
  includes:
    - "*.pdf"
    - "*.doc"
    - "*.docx"
    - "*.txt"
  excludes:
    - "*.tmp"
  json_support: false
  filename_as_id: false
  add_filesize: true
  remove_deleted: true
  add_as_inner_object: false
  store_source: false
  index_content: true
  attributes_support: false
  raw_metadata: true
  xml_support: false
  index_folders: true
  lang_detect: false
  continue_on_error: true
  ocr:
    language: "eng"
    enabled: true
    
elasticsearch:
  nodes:
    - url: "http://elasticsearch:9200"
  index: "documents"
  bulk_size: 100
  flush_interval: "5s"
  byte_size: "10mb"

rest:
  url: "http://0.0.0.0:8080" 